name: Content Sync & Deployment

on:
  # Daily, not weekly. On 2026-09-06 project42-content retracted a review-date
  # uplift fifteen hours AFTER this workflow's last weekly run, and the next one
  # was six days away. For those six days project-42.dev asserted a freshness
  # date the source of truth had withdrawn. A week is too long to be wrong in
  # public about when the curriculum was last reviewed.
  schedule:
    - cron: '0 0 * * *' # Vector 1: Daily cron
  workflow_dispatch:     # Vector 2: Manual UI trigger
  repository_dispatch:   # Vector 3: Webhook from Orchard
    types: [content_updated]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  # This job is the alarm. sync-and-deploy below installs upstream content into
  # the RUNNER's workspace, validates it, builds it, and then throws all of it
  # away: it commits nothing and deploys nothing, so a green run has never been
  # evidence that project-42.dev serves what project42-content records. Making
  # the sync commit its result is an owner decision (it writes curriculum to
  # main unattended) and is deliberately not taken here. What is taken here is
  # the visibility: when the served dates and upstream disagree, this fails,
  # every day, by name.
  currency-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout platform repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Checkout canonical content repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: project42dev/project42-content
          path: .content-upstream

      - name: Install dependencies
        run: npm ci

      - name: Every served review date must match project42-content
        run: npm run content:currency -- --source .content-upstream

  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The canonical curriculum lives in project42-content (docs/architecture.md,
      # layer 2). This job exists to pull it, so it needs that repository
      # checked out -- previously it did not, and the sync step could not have
      # reached upstream even if it had tried.
      - name: Checkout canonical content repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: project42dev/project42-content
          path: .content-upstream

      # No `|| echo` here. The previous form swallowed every failure and printed
      # a success message, which is how content/ drifted from upstream by a
      # whole learning path and 100 KB of catalogue without anyone seeing it.
      # If the sync cannot run, this job must stop.
      - name: Sync upstream content
        run: npm run content:sync -- --source .content-upstream

      - name: Validate content schema and tests
        run: npm test

      - name: Build static site export
        run: npm run build
