name: Content Sync & Deployment

on:
  # Daily, not weekly. The curriculum is corrected by hand in project42-content
  # and nothing there notifies this repository -- that repo has no
  # .github/workflows at all, so the repository_dispatch vector below has never
  # had a sender. A weekly cron was therefore the only live vector, and it is
  # how a retraction landed upstream on 2026-09-06 at 18:08Z, fifteen hours
  # after that week's run, and then sat unpulled while production served the
  # retracted review dates.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [content_updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The canonical curriculum lives in project42-content (docs/architecture.md,
      # layer 2). This job exists to pull it, so it needs that repository
      # checked out -- previously it did not, and the sync step could not have
      # reached upstream even if it had tried.
      - name: Checkout canonical content repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: project42dev/project42-content
          path: .content-upstream

      # Recorded BEFORE the sync so the steps below can tell the one innocent
      # explanation for "nothing changed" apart from the guilty ones:
      #   pin already at upstream head + no diff -> genuinely current
      #   pin behind upstream head     + no diff -> the sync did not take
      - name: Record the pin and the canonical head
        id: baseline
        run: |
          set -euo pipefail
          locked="$(node -p "require('./config/content.lock.json').upstream.commit")"
          upstream="$(git -C .content-upstream rev-parse HEAD)"
          test -n "$locked"
          test -n "$upstream"
          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "Pinned at $locked; canonical head is $upstream."

      # No `|| echo` here. The previous form swallowed every failure and printed
      # a success message, which is how content/ drifted from upstream by a
      # whole learning path and 100 KB of catalogue without anyone seeing it.
      # If the sync cannot run, this job must stop.
      - name: Sync upstream content
        run: npm run content:sync -- --source .content-upstream

      # A sync that reached upstream ALWAYS rewrites the lock to the commit it
      # installed from. If the lock does not now name the head that was checked
      # out, the install did not come from the canonical repository, whatever
      # the previous step's exit code said.
      - name: Prove the sync installed from the canonical head
        env:
          UPSTREAM: ${{ steps.baseline.outputs.upstream }}
        run: |
          set -euo pipefail
          installed="$(node -p "require('./config/content.lock.json').upstream.commit")"
          if [ "$installed" != "$UPSTREAM" ]; then
            echo "::error::content.lock.json records $installed after the sync but the canonical head is $UPSTREAM. The sync did not install from upstream."
            exit 1
          fi
          echo "Lock now records the canonical head."

      - name: Classify the result
        id: result
        env:
          LOCKED: ${{ steps.baseline.outputs.locked }}
          UPSTREAM: ${{ steps.baseline.outputs.upstream }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- content config/content.lock.json | wc -l | tr -d ' ')"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "$changed path(s) changed."

          if [ "$changed" -gt 0 ]; then
            echo "outcome=changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Zero changes. Whether that is health or a silent failure depends on
          # whether the pin had anything to catch up to.
          if [ "$LOCKED" != "$UPSTREAM" ]; then
            echo "::error::The pin was at $LOCKED and the canonical head is $UPSTREAM, yet the sync produced no change. Upstream commits between those two did not reach content/."
            exit 1
          fi

          # An idle daily cron over an unchanged upstream is the one legitimate
          # no-op. A person or a webhook asking for a sync is not: they fired
          # because something was expected to move.
          if [ "$EVENT" != "schedule" ]; then
            echo "::error::$EVENT requested a sync but the curriculum was already at $UPSTREAM and nothing changed."
            exit 1
          fi

          echo "outcome=current" >> "$GITHUB_OUTPUT"
          echo "Curriculum already current at $UPSTREAM."

      # Structural gates. These answer whether the installed tree is
      # INSTALLABLE -- that it matches its own lock and still compiles -- so a
      # broken upstream never becomes a pull request. Whether the curriculum is
      # CURRENT is a different question, answered in the last step.
      - name: Verify the installed tree against its lock
        if: steps.result.outputs.outcome == 'changes'
        run: npm run content:check

      - name: Build static site export
        if: steps.result.outputs.outcome == 'changes'
        run: npm run build

      # Everything above this line used to be thrown away. The job installed the
      # curriculum into the runner's working tree, validated it, built it, and
      # exited -- no commit, no push, no pull request -- so main never moved.
      # Three scheduled runs reported success that way while content/ sat one
      # commit behind a retraction. `contents: write` was declared and unused.
      - name: Propose the sync as a pull request
        if: steps.result.outputs.outcome == 'changes'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCKED: ${{ steps.baseline.outputs.locked }}
          UPSTREAM: ${{ steps.baseline.outputs.upstream }}
          CHANGED: ${{ steps.result.outputs.changed }}
        run: |
          set -euo pipefail
          # One fixed branch, force-pushed, carrying whatever upstream currently
          # says. A branch named per upstream sha would open a second pull
          # request every time the curriculum moved while the first was still
          # unmerged, and -- because actions/checkout fetches only the
          # triggering ref -- --force-with-lease would have no tracking ref to
          # lease against and would reject the second day's push outright.
          branch=content-sync
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch --create "$branch"
          # Named paths only. .content-upstream is a checkout of another
          # repository sitting in this working tree and must never be committed.
          git add -- content config/content.lock.json
          git commit --message "chore(content): sync curriculum from project42-content@$UPSTREAM

          Installed by .github/workflows/content-sync.yml from the canonical
          curriculum repository. Curriculum is authored upstream and is never
          edited here.

          Upstream: https://github.com/project42dev/project42-content/commit/$UPSTREAM
          Previous pin: $LOCKED"
          git push --force origin "$branch"

          title="chore(content): sync curriculum from project42-content@$(printf '%.7s' "$UPSTREAM")"
          body="Automated curriculum sync.

          - Canonical head: \`$UPSTREAM\`
          - Previous pin: \`$LOCKED\`
          - Paths changed: $CHANGED
          - Gates for this sync: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This branch is authored by GITHUB_TOKEN, so GitHub deliberately does not
          start a \`pull_request\` CI run on it. The linked job above is the gate:
          it verified the installed tree against its lock, built the site, and
          reports the curriculum's currency in its final step.

          The curriculum is authored in project42-content. This pull request only
          installs it; \`content/\` is never edited in this repository.

          If the currency gate is red, the curriculum's own review dates have
          expired. That is a finding about the content, not a sync failure -- the
          remedy is to re-read the sources upstream, never to hold this sync back."

          # The push above is the part that matters: the curriculum is now in
          # this repository and recoverable by hand even if nothing below works.
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated pull request #$existing."
            exit 0
          fi

          if gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            exit 0
          fi

          # Repository setting "Allow GitHub Actions to create and approve pull
          # requests" is off by default in this organisation, and with it off
          # gh pr create is refused however the token is scoped. Say which
          # switch, rather than leaving an API error for someone to decode.
          echo "::error::The sync is committed and pushed to the '$branch' branch, but this job could not open a pull request for it. Enable Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests' on project42dev/project42-platform, or open the pull request from '$branch' by hand. The curriculum itself is safe on that branch."
          exit 1

      # Currency, last and deliberately. This asks whether the curriculum's own
      # review dates have expired, which is a fact about the content rather than
      # about the sync. It runs AFTER the pull request exists so that a
      # stale-but-true curriculum still reaches this repository: refusing to
      # install overdue content is precisely what leaves a copy quietly
      # asserting dates that upstream has already retracted. It still fails the
      # job, loudly, on every day it is true.
      - name: Report curriculum currency
        run: |
          # Both, always, then fail. Chaining these with && let the first
          # failure hide the second, and the number worth reading -- how many
          # citations are actually overdue -- is the one the second prints.
          status=0
          npm run content:freshness || status=1
          npm test || status=1
          exit "$status"
