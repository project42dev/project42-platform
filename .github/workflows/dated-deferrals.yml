name: Dated deferrals

# The Caddy CVE deferral in self-host/.trivyignore.yaml is honoured by Trivy,
# but that scan lives in the 25-minute secure-self-host job and only runs when
# somebody pushes. An expiry that waits for the next change is not an expiry,
# so this runs on its own each morning: the date alone is enough to fail.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deferrals:
    name: Fail once a scanner deferral has expired
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Check dated scanner exceptions
        run: node --test tests/dated-deferrals.test.mjs
