name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: project42_test
          POSTGRES_USER: project42
          POSTGRES_PASSWORD: project42-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project42 -d project42_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://project42:project42-ci-only@127.0.0.1:5432/project42_test
    steps:
      - name: Enforce public tracker boundary
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string] $env:PULL_REQUEST_BODY -match '(?i)https://dev\.azure\.com/') {
            throw 'Public pull-request bodies cannot contain private Azure DevOps URLs.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  self-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate Compose model
        run: docker compose --env-file self-host/.env.example -f self-host/compose.yaml config --quiet
      - name: Start evaluation stack
        run: docker compose --env-file self-host/.env.example -f self-host/compose.yaml up --build --detach --wait
      - name: Verify API and identity discovery
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8787/health
          curl --fail --show-error --silent --retry 10 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8080/realms/project42/.well-known/openid-configuration
      - name: Verify Keycloak provisioning lifecycle
        env:
          PROJECT42_IDENTITY_ADMIN_PASSWORD: replace-with-a-different-long-random-password
        run: node scripts/smoke-keycloak-provisioning.mjs
      - name: Verify Keycloak browser-session lifecycle
        run: >-
          docker compose
          --env-file self-host/.env.example
          -f self-host/compose.yaml
          --profile test
          run --rm --build browser-session-smoke
      - name: Capture diagnostics
        if: failure()
        run: docker compose --env-file self-host/.env.example -f self-host/compose.yaml logs --no-color
      - name: Stop evaluation stack
        if: always()
        run: docker compose --env-file self-host/.env.example -f self-host/compose.yaml down --volumes

  secure-self-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT42_VERSION: 0.71.0
      PROJECT42_LEARN_SOURCE_REF: f9e9cd1293bd7337c4c71e78f7e7f21e31ca4e52
      PROJECT42_INSTALLATION_ID: ci-secure-topology
      PROJECT42_DATABASE_PASSWORD: K7v9nP4rX2mQ8sL6zC5dH3jF
      PROJECT42_IDENTITY_ADMIN_PASSWORD: W6q2Zp8rN4c7Vx5mJ9s3Kt1H
      PROJECT42_SESSION_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
      PROJECT42_ACCOUNT_MERGE_REQUIRED_CONSENTS: '[{"purpose":"learning-record","policyVersion":"2026-07-27"}]'
      PROJECT42_BOOTSTRAP_OWNER_ISSUER: https://identity.project42.localhost/realms/project42
      PROJECT42_BROWSER_SMOKE_EMAIL: secure-compose-owner@example.test
      PROJECT42_BROWSER_SMOKE_PASSWORD: J8s2N7q4R9v6X3m5K1c8H4w7D2p9F6t3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce deterministic self-host security policy
        run: node scripts/scan-self-host-release.mjs
      - name: Scan secure configuration and packaged files
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.66.0 \
            config --exit-code 1 --severity CRITICAL /workspace/self-host
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:0.66.0 \
            fs --scanners secret --exit-code 1 --severity HIGH,CRITICAL \
            /workspace/self-host
      - name: Validate secure Compose model
        run: docker compose -f self-host/compose.https.yaml config --quiet
      - name: Start secure identity prerequisites
        run: |
          docker compose -f self-host/compose.https.yaml \
            up --detach --wait database identity gateway
          docker compose -f self-host/compose.https.yaml \
            run --rm --no-deps trust-export
      - name: Provision immutable browser-smoke identity
        shell: bash
        run: |
          set -euo pipefail
          identity=(docker compose -f self-host/compose.https.yaml exec -T identity /opt/keycloak/bin/kcadm.sh)
          "${identity[@]}" config credentials \
            --server http://127.0.0.1:8080 \
            --realm master \
            --user bootstrap-admin \
            --password "$PROJECT42_IDENTITY_ADMIN_PASSWORD"
          subject="$("${identity[@]}" create users -r project42 -i \
            -s "username=$PROJECT42_BROWSER_SMOKE_EMAIL" \
            -s "email=$PROJECT42_BROWSER_SMOKE_EMAIL" \
            -s 'firstName=Secure' \
            -s 'lastName=Compose Owner' \
            -s 'enabled=true' \
            -s 'emailVerified=true')"
          test -n "$subject"
          "${identity[@]}" set-password -r project42 \
            --userid "$subject" \
            --new-password "$PROJECT42_BROWSER_SMOKE_PASSWORD"
          {
            echo "PROJECT42_BOOTSTRAP_OWNER_SUBJECT=$subject"
            echo "PROJECT42_BROWSER_SMOKE_SUBJECT=$subject"
          } >> "$GITHUB_ENV"
      - name: Start complete secure stack
        run: docker compose -f self-host/compose.https.yaml up --build --detach --wait
      - name: Verify HTTPS API, identity, and sign-in surface
        run: >-
          docker compose
          -f self-host/compose.https.yaml
          --profile test
          run --rm secure-topology-smoke
      - name: Verify real browser authentication and secure session
        run: >-
          docker compose
          -f self-host/compose.https.yaml
          --profile test
          run --rm --build secure-browser-session-smoke
      - name: Verify secure backup and isolated restore
        run: >-
          docker compose
          -f self-host/compose.https.yaml
          --profile test
          run --rm secure-backup-restore-smoke
      - name: Scan every secure-topology image
        run: |
          mapfile -t images < <(
            docker compose \
              -f self-host/compose.https.yaml \
              --profile test \
              config --images |
            sort --unique
          )
          test "${#images[@]}" -gt 0
          for image in "${images[@]}"; do
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.66.0 \
              image --exit-code 1 --severity CRITICAL "$image"
          done
      - name: Verify only the HTTPS gateway is published
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $services = @(docker compose -f self-host/compose.https.yaml ps --format json |
            ConvertFrom-Json)
          $publishedEndpoints = @($services | ForEach-Object {
            $serviceName = $_.Service
            @($_.Publishers) |
              Where-Object { $_.PublishedPort -gt 0 } |
              ForEach-Object {
                [PSCustomObject]@{
                  Service = $serviceName
                  Port = [int]$_.PublishedPort
                  Protocol = $_.Protocol
                }
              }
          })
          $publishedServiceNames = @($publishedEndpoints.Service |
            Sort-Object -Unique)
          $unexpectedEndpoints = @($publishedEndpoints |
            Where-Object { $_.Port -ne 443 -or $_.Protocol -ne 'tcp' })
          if (
            $publishedEndpoints.Count -eq 0 -or
            $publishedServiceNames.Count -ne 1 -or
            $publishedServiceNames[0] -ne 'gateway' -or
            $unexpectedEndpoints.Count -gt 0
          ) {
            throw "The secure topology must publish exactly TCP 443."
          }
      - name: Capture secure-stack diagnostics
        if: failure()
        run: docker compose -f self-host/compose.https.yaml logs --no-color
      - name: Stop secure stack
        if: always()
        run: docker compose -f self-host/compose.https.yaml down --volumes

  # AB#5418 requires the Authorization Code + PKCE flow to complete against the
  # hosted test provider as well as the reference self-host provider above. This
  # job is the hosted leg. It runs only where a hosted test identity is
  # configured, because it signs in as a real user against a real issuer; it
  # cannot be satisfied by a stub without defeating its own purpose.
  hosted-identity-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.PROJECT42_HOSTED_IDENTITY_ENABLED == 'true'
    env:
      PROJECT42_HOSTED_LEARN_ORIGIN: ${{ vars.PROJECT42_HOSTED_LEARN_ORIGIN }}
      PROJECT42_HOSTED_API_ORIGIN: ${{ vars.PROJECT42_HOSTED_API_ORIGIN }}
      PROJECT42_HOSTED_ISSUER: ${{ vars.PROJECT42_HOSTED_ISSUER }}
      PROJECT42_HOSTED_SMOKE_EMAIL: ${{ secrets.PROJECT42_HOSTED_SMOKE_EMAIL }}
      PROJECT42_HOSTED_SMOKE_PASSWORD: ${{ secrets.PROJECT42_HOSTED_SMOKE_PASSWORD }}
      PROJECT42_HOSTED_SMOKE_SUBJECT: ${{ secrets.PROJECT42_HOSTED_SMOKE_SUBJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify hosted-provider PKCE sign-in and secure session
        run: node scripts/smoke-hosted-browser-session.mjs
