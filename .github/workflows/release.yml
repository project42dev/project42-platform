name: Signed release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release source
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npm ci
          npm run check
          npm run api:check
          npm audit --audit-level=moderate
      - name: Build release archive
        run: |
          mkdir release
          npm pack --pack-destination release
          mv release/project42-platform-*.tgz "release/project42-platform-${GITHUB_REF_NAME}.tgz"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/project42-platform-api"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --file self-host/Dockerfile \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file release/image-metadata.json \
            --push .
          digest="$(jq -r '."containerimage.digest"' release/image-metadata.json)"
          test "$digest" != "null"
          echo "PROJECT42_IMAGE=${image}@${digest}" >> "$GITHUB_ENV"
          jq --arg digest "$digest" '.api.digest = $digest' \
            self-host/compatibility.json > release/compatibility.json
          node scripts/validate-self-host-release.mjs release/compatibility.json
          (
            cd release
            sha256sum project42-platform-*.tgz compatibility.json image-metadata.json > SHA256SUMS
          )
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            release/project42-platform-*.tgz
            release/compatibility.json
            release/image-metadata.json
            release/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign release artifacts and image
        run: |
          cosign sign --yes "$PROJECT42_IMAGE"
          cosign sign-blob --yes \
            --bundle release/project42-platform.sigstore.json \
            "release/project42-platform-${GITHUB_REF_NAME}.tgz"
          cosign sign-blob --yes \
            --bundle release/compatibility.sigstore.json \
            release/compatibility.json
          cosign sign-blob --yes \
            --bundle release/image-metadata.sigstore.json \
            release/image-metadata.json
      - name: Verify signatures and provenance before publication
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$PROJECT42_IMAGE"
          cosign verify-blob \
            --bundle release/project42-platform.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "release/project42-platform-${GITHUB_REF_NAME}.tgz"
          cosign verify-blob \
            --bundle release/compatibility.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/compatibility.json
          cosign verify-blob \
            --bundle release/image-metadata.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release/image-metadata.json
          gh attestation verify "release/project42-platform-${GITHUB_REF_NAME}.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          gh attestation verify release/compatibility.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          gh attestation verify release/image-metadata.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "Project 42 platform ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
