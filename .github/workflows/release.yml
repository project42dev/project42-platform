name: Signed release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate candidate without publishing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate release candidate
        run: |
          npm ci
          npm run check
          npm run api:check
          npm audit --audit-level=moderate
      - name: Stage and rehearse candidate without publishing
        run: |
          version="$(node -p "require('./package.json').version")"
          source_commit="$(git rev-parse HEAD)"
          mkdir release
          npm pack --pack-destination release
          mv release/project42-platform-*.tgz "release/project42-platform-v${version}.tgz"
          cp self-host/compatibility.json "release/project42-compatibility-v${version}.json"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "release/project42-content-v${version}.tar.gz" \
            content LICENSE-CONTENT.md
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "release/project42-migrations-v${version}.tar.gz" \
            migrations
          npm run release:manifest -- \
            --release-dir release \
            --version "$version" \
            --source-commit "$source_commit"
          npm run release:rehearse -- \
            --release-dir release \
            --version "$version"
          npm run release:manifest -- \
            --release-dir release \
            --version "$version" \
            --source-commit "$source_commit"
          npm run release:check -- --release-dir=release

  release:
    name: Publish signed tag release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release source
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npm ci
          npm run check
          npm run api:check
          npm audit --audit-level=moderate
      - name: Build versioned release artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          npm pack --pack-destination release
          mv release/project42-platform-*.tgz "release/project42-platform-v${version}.tgz"
          cp self-host/compatibility.json "release/project42-compatibility-v${version}.json"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "release/project42-content-v${version}.tar.gz" \
            content LICENSE-CONTENT.md
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "release/project42-migrations-v${version}.tar.gz" \
            migrations
          npm run release:manifest -- \
            --release-dir release \
            --version "$version" \
            --source-commit "$GITHUB_SHA"
          npm run release:rehearse -- \
            --release-dir release \
            --version "$version"
          npm run release:manifest -- \
            --release-dir release \
            --version "$version" \
            --source-commit "$GITHUB_SHA"
          npm run release:check -- --release-dir=release
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/project42-platform-api"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --file self-host/Dockerfile \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "release/project42-image-metadata-v${version}.json" \
            --push .
          digest="$(jq -r '."containerimage.digest"' "release/project42-image-metadata-v${version}.json")"
          test "$digest" != "null"
          echo "PROJECT42_IMAGE=${image}@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign release artifacts and image
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm run release:manifest -- \
            --release-dir release \
            --version "$version" \
            --source-commit "$GITHUB_SHA"
          npm run release:check -- --release-dir=release
          cosign sign --yes "$PROJECT42_IMAGE"
          for artifact in \
            "release/project42-platform-v${version}.tgz" \
            "release/project42-content-v${version}.tar.gz" \
            "release/project42-migrations-v${version}.tar.gz" \
            "release/project42-compatibility-v${version}.json" \
            "release/project42-release-manifest-v${version}.json" \
            "release/project42-release-rehearsal-v${version}.json" \
            "release/project42-image-metadata-v${version}.json" \
            release/SHA256SUMS
          do
            cosign sign-blob --yes \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            release/project42-platform-*.tgz
            release/project42-content-*.tar.gz
            release/project42-migrations-*.tar.gz
            release/project42-compatibility-*.json
            release/project42-release-manifest-*.json
            release/project42-release-rehearsal-*.json
            release/project42-image-metadata-*.json
            release/SHA256SUMS
      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Project 42 platform ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
