name: project42

services:
  database:
    build:
      context: ./postgres
    image: project42/postgres:${PROJECT42_VERSION:-local}
    environment:
      POSTGRES_DB: project42
      POSTGRES_USER: project42
      POSTGRES_PASSWORD: ${PROJECT42_DATABASE_PASSWORD:?set PROJECT42_DATABASE_PASSWORD}
    volumes:
      - project42_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project42 -d project42"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PROJECT42_IDENTITY_ADMIN_PASSWORD:?set PROJECT42_IDENTITY_ADMIN_PASSWORD}
    volumes:
      - project42_identity:/opt/keycloak/data
      - ./keycloak/project42-realm.json:/opt/keycloak/data/import/project42-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: self-host/Dockerfile
    image: project42/platform-api:${PROJECT42_VERSION:-local}
    environment:
      NODE_ENV: evaluation
      PROJECT42_EVALUATION_MODE: "true"
      PORT: "8787"
      PUBLIC_URL: ${PROJECT42_PUBLIC_URL:-http://localhost:8787}
      INSTALLATION_ID: ${PROJECT42_INSTALLATION_ID:?set PROJECT42_INSTALLATION_ID}
      DATABASE_URL: postgresql://project42:${PROJECT42_DATABASE_PASSWORD}@database:5432/project42
      DATABASE_TLS: "false"
      LEARNING_RECORD_ADAPTER: ${PROJECT42_LEARNING_RECORD_ADAPTER:-postgresql}
      ACCOUNT_MERGE_REQUIRED_CONSENTS: ${PROJECT42_ACCOUNT_MERGE_REQUIRED_CONSENTS:?set PROJECT42_ACCOUNT_MERGE_REQUIRED_CONSENTS}
      ACCOUNT_NOTIFICATION_ADAPTER_MODULE: ${PROJECT42_ACCOUNT_NOTIFICATION_ADAPTER_MODULE:-}
      OIDC_ISSUER: ${PROJECT42_OIDC_ISSUER:-http://localhost:8080/realms/project42}
      OIDC_AUDIENCE: ${PROJECT42_OIDC_AUDIENCE:-project42-api}
      OIDC_JWKS_URL: ${PROJECT42_OIDC_JWKS_URL:-http://identity:8080/realms/project42/protocol/openid-connect/certs}
      OIDC_EMAIL_CLAIM: email
      OIDC_EMAIL_VERIFIED_CLAIM: email_verified
      BROWSER_SESSION_MODE: ${PROJECT42_BROWSER_SESSION_MODE:-disabled}
      OIDC_AUTHORIZATION_ENDPOINT: ${PROJECT42_OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${PROJECT42_OIDC_TOKEN_ENDPOINT:-}
      OIDC_CLIENT_ID: ${PROJECT42_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${PROJECT42_OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${PROJECT42_OIDC_REDIRECT_URI:-}
      OIDC_LOGOUT_ENDPOINT: ${PROJECT42_OIDC_LOGOUT_ENDPOINT:-}
      SESSION_ENCRYPTION_KEY: ${PROJECT42_SESSION_ENCRYPTION_KEY:-}
      ALLOWED_ORIGINS: ${PROJECT42_ALLOWED_ORIGINS:-http://localhost:3000}
      DOMAIN_APPROVAL_ENABLED: "false"
      PROFILE_PHOTO_DIRECTORY: /var/lib/project42/profile-photos
      MIGRATION_DIRECTORY: self-host/postgres
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:http').get('http://127.0.0.1:8787/health',
          (response) => process.exit(response.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    ports:
      - "8787:8787"
    volumes:
      - project42_profile_photos:/var/lib/project42/profile-photos
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped

  browser-session-smoke:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: self-host/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://project42:${PROJECT42_DATABASE_PASSWORD}@database:5432/project42
      PROJECT42_KEYCLOAK_BASE_URL: http://identity:8080
      PROJECT42_IDENTITY_ADMIN_PASSWORD: ${PROJECT42_IDENTITY_ADMIN_PASSWORD:?set PROJECT42_IDENTITY_ADMIN_PASSWORD}
    command: ["node", "scripts/smoke-keycloak-browser-session.mjs"]
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

volumes:
  project42_database:
  project42_identity:
  project42_profile_photos:
