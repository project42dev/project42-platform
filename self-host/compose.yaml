name: project42

services:
  database:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: project42
      POSTGRES_USER: project42
      POSTGRES_PASSWORD: ${PROJECT42_DATABASE_PASSWORD:?set PROJECT42_DATABASE_PASSWORD}
    volumes:
      - project42_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project42 -d project42"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PROJECT42_IDENTITY_ADMIN_PASSWORD:?set PROJECT42_IDENTITY_ADMIN_PASSWORD}
    volumes:
      - project42_identity:/opt/keycloak/data
      - ./keycloak/project42-realm.json:/opt/keycloak/data/import/project42-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: self-host/Dockerfile
    image: project42/platform-api:${PROJECT42_VERSION:-local}
    environment:
      NODE_ENV: evaluation
      PROJECT42_EVALUATION_MODE: "true"
      PORT: "8787"
      PUBLIC_URL: ${PROJECT42_PUBLIC_URL:-http://localhost:8787}
      INSTALLATION_ID: ${PROJECT42_INSTALLATION_ID:?set PROJECT42_INSTALLATION_ID}
      DATABASE_URL: postgresql://project42:${PROJECT42_DATABASE_PASSWORD}@database:5432/project42
      DATABASE_TLS: "false"
      OIDC_ISSUER: ${PROJECT42_OIDC_ISSUER:-http://localhost:8080/realms/project42}
      OIDC_AUDIENCE: ${PROJECT42_OIDC_AUDIENCE:-project42-api}
      OIDC_JWKS_URL: ${PROJECT42_OIDC_JWKS_URL:-http://identity:8080/realms/project42/protocol/openid-connect/certs}
      OIDC_EMAIL_CLAIM: email
      OIDC_EMAIL_VERIFIED_CLAIM: email_verified
      ALLOWED_ORIGINS: ${PROJECT42_ALLOWED_ORIGINS:-http://localhost:3000}
      DOMAIN_APPROVAL_ENABLED: "false"
      MIGRATION_DIRECTORY: self-host/postgres
    depends_on:
      database:
        condition: service_healthy
      identity:
        condition: service_healthy
    ports:
      - "8787:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8787/health').then((response) => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    restart: unless-stopped

  learn:
    image: >-
      ghcr.io/project42dev/project42-learn:${PROJECT42_LEARN_VERSION:-0.4.0}@${PROJECT42_LEARN_DIGEST:-sha256:903f0ee264ad6930d5092a5ec5ac55a8edee50cc5a699151902a0dfa18df7252}
    depends_on:
      api:
        condition: service_healthy
      identity:
        condition: service_healthy
    ports:
      - "3000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  project42_database:
  project42_identity:
