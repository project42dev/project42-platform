<!-- Alt text: A navy boundary contains four parts of a bounded task: question, inputs, constraints, and evidence. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Bounded task</title>
  <desc id="desc">A boundary around four elements: question, inputs, constraints, and evidence.</desc>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <rect x="55" y="45" width="790" height="410" rx="28" fill="#0b1225"/>
  <text x="90" y="100" fill="#c9f25f" font-family="Arial, sans-serif" font-size="30" font-weight="700">BOUNDED TASK</text>
  <text x="90" y="135" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="17">Make the work small enough to inspect.</text>
  <g font-family="Arial, sans-serif" font-size="23" font-weight="700">
    <rect x="95" y="190" width="310" height="90" rx="16" fill="#63d7e4"/>
    <text x="125" y="245" fill="#0b1225">1. Question</text>
    <rect x="495" y="190" width="310" height="90" rx="16" fill="#a99df7"/>
    <text x="525" y="245" fill="#0b1225">2. Inputs</text>
    <rect x="95" y="325" width="310" height="90" rx="16" fill="#ff8c5a"/>
    <text x="125" y="380" fill="#0b1225">3. Constraints</text>
    <rect x="495" y="325" width="310" height="90" rx="16" fill="#c9f25f"/>
    <text x="525" y="380" fill="#0b1225">4. Evidence</text>
  </g>
</svg>