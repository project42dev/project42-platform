<!-- Alt text: Six connected steps show an inspectable workflow from reading input through structure checks, validation, selection, calculation, and recorded evidence. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Inspectable increments</title>
  <desc id="desc">A six-step workflow: read, check structure, validate values, select, calculate, and record evidence.</desc>
  <rect width="1100" height="430" fill="#f6f3eb"/>
  <text x="55" y="60" fill="#0b1225" font-family="Arial, sans-serif" font-size="29" font-weight="700">SMALL STEPS, VISIBLE OUTPUTS</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="17" font-weight="700">
      <rect x="45" y="130" width="145" height="120" rx="16" fill="#63d7e4"/>
      <text x="117" y="180" fill="#0b1225">1. Read</text>
      <text x="117" y="211" fill="#0b1225" font-size="14" font-weight="400">input</text>
      <rect x="215" y="130" width="145" height="120" rx="16" fill="#a99df7"/>
      <text x="287" y="180" fill="#0b1225">2. Check</text>
      <text x="287" y="211" fill="#0b1225" font-size="14" font-weight="400">structure</text>
      <rect x="385" y="130" width="145" height="120" rx="16" fill="#ff8c5a"/>
      <text x="457" y="180" fill="#0b1225">3. Validate</text>
      <text x="457" y="211" fill="#0b1225" font-size="14" font-weight="400">values</text>
      <rect x="555" y="130" width="145" height="120" rx="16" fill="#c9f25f"/>
      <text x="627" y="180" fill="#0b1225">4. Select</text>
      <text x="627" y="211" fill="#0b1225" font-size="14" font-weight="400">by rule</text>
      <rect x="725" y="130" width="145" height="120" rx="16" fill="#63d7e4"/>
      <text x="797" y="180" fill="#0b1225">5. Calculate</text>
      <text x="797" y="211" fill="#0b1225" font-size="14" font-weight="400">result</text>
      <rect x="895" y="130" width="160" height="120" rx="16" fill="#a99df7"/>
      <text x="975" y="180" fill="#0b1225">6. Record</text>
      <text x="975" y="211" fill="#0b1225" font-size="14" font-weight="400">evidence</text>
    </g>
  </g>
  <g stroke="#0b1225" stroke-width="4" fill="none">
    <path d="M190 190 H215"/><path d="M360 190 H385"/>
    <path d="M530 190 H555"/><path d="M700 190 H725"/>
    <path d="M870 190 H895"/>
  </g>
</svg>