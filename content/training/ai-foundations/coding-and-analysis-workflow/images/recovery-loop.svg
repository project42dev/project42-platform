<!-- Alt text: A clear recovery sequence moves from failure to pause and preserve, classify, revert or isolate, make one change, and verify. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Safe recovery sequence</title>
  <desc id="desc">A left-to-right recovery flow with a decision to revert or isolate before making one change and verifying it.</desc>
  <rect width="1000" height="430" fill="#f6f3eb"/>
  <text x="55" y="58" fill="#0b1225" font-family="Arial, sans-serif" font-size="29" font-weight="700">SAFE RECOVERY</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="17" font-weight="700">
    <rect x="45" y="155" width="135" height="75" rx="15" fill="#ff8c5a"/>
    <text x="112" y="199" fill="#0b1225">Failure</text>
    <rect x="220" y="155" width="175" height="75" rx="15" fill="#63d7e4"/>
    <text x="307" y="190" fill="#0b1225">Pause and</text>
    <text x="307" y="213" fill="#0b1225">preserve</text>
    <rect x="435" y="155" width="145" height="75" rx="15" fill="#a99df7"/>
    <text x="507" y="199" fill="#0b1225">Classify</text>
    <polygon points="660,140 735,192 660,244 585,192" fill="#c9f25f"/>
    <text x="660" y="187" fill="#0b1225" font-size="15">Known-good</text>
    <text x="660" y="208" fill="#0b1225" font-size="15">state?</text>
    <rect x="805" y="85" width="150" height="65" rx="14" fill="#a99df7"/>
    <text x="880" y="124" fill="#0b1225">Revert</text>
    <rect x="805" y="260" width="150" height="65" rx="14" fill="#63d7e4"/>
    <text x="880" y="299" fill="#0b1225">Isolate</text>
    <rect x="435" y="330" width="145" height="65" rx="14" fill="#c9f25f"/>
    <text x="507" y="369" fill="#0b1225">One change</text>
    <rect x="220" y="330" width="175" height="65" rx="14" fill="#ff8c5a"/>
    <text x="307" y="369" fill="#0b1225">Focused verify</text>
  </g>
  <g stroke="#0b1225" stroke-width="4" fill="none">
    <path d="M180 192 H220"/><path d="M395 192 H435"/><path d="M580 192 H585"/>
    <path d="M700 155 C750 130 775 120 805 120"/>
    <path d="M700 229 C750 270 775 292 805 292"/>
    <path d="M805 150 C720 260 650 325 580 360"/>
    <path d="M805 325 C720 350 650 360 580 360"/>
    <path d="M435 362 H395"/><path d="M220 362 C145 300 125 260 150 230"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#0b1225">
    <text x="735" y="112">yes</text><text x="735" y="276">no</text>
  </g>
</svg>

