<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <!-- Alt text: Four connected cards labeled source, tool, output, and verification form an evidence trail leading to a trustworthy result. -->
  <title id="title">Evidence trail</title>
  <desc id="desc">Source, tool, output, and verification records connect to support a final result.</desc>
  <rect width="1000" height="560" fill="#0b1225"/>
  <text x="70" y="78" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="32" font-weight="700">MAKE THE WORK TRACEABLE</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="210" width="180" height="125" rx="16" fill="#63d7e4"/>
    <text x="160" y="265" fill="#0b1225" font-size="25" font-weight="700">SOURCE</text>
    <text x="160" y="300" fill="#0b1225" font-size="17">where facts came from</text>
    <rect x="290" y="210" width="180" height="125" rx="16" fill="#a99df7"/>
    <text x="380" y="265" fill="#0b1225" font-size="25" font-weight="700">TOOL</text>
    <text x="380" y="300" fill="#0b1225" font-size="17">what process was used</text>
    <rect x="510" y="210" width="180" height="125" rx="16" fill="#ff8c5a"/>
    <text x="600" y="265" fill="#0b1225" font-size="25" font-weight="700">OUTPUT</text>
    <text x="600" y="300" fill="#0b1225" font-size="17">what was produced</text>
    <rect x="730" y="210" width="180" height="125" rx="16" fill="#c9f25f"/>
    <text x="820" y="265" fill="#0b1225" font-size="25" font-weight="700">CHECK</text>
    <text x="820" y="300" fill="#0b1225" font-size="17">what was verified</text>
  </g>
  <path d="M250 272 H290 M470 272 H510 M690 272 H730" stroke="#f6f3eb" stroke-width="7"/>
  <text x="290" y="420" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="21">Evidence connects an action to a claim.</text>
</svg>