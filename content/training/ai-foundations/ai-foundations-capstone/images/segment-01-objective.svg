<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <!-- Alt text: A navy canvas shows a broad idea narrowing through audience, artifact, source boundary, and quality threshold into a lime bounded objective. -->
  <title id="title">Narrowing an objective</title>
  <desc id="desc">A funnel narrows a broad idea into a specific bounded objective.</desc>
  <rect width="1000" height="560" fill="#0b1225"/>
  <text x="70" y="75" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="32" font-weight="700">BOUND THE OBJECTIVE</text>
  <text x="70" y="120" fill="#63d7e4" font-family="Arial, sans-serif" font-size="20">Specific enough to finish and inspect</text>
  <path d="M120 180 L880 180 L720 440 L280 440 Z" fill="#a99df7"/>
  <path d="M240 210 L760 210 L680 330 L320 330 Z" fill="#63d7e4"/>
  <path d="M350 355 L650 355 L610 440 L390 440 Z" fill="#c9f25f"/>
  <text x="390" y="265" fill="#0b1225" font-family="Arial, sans-serif" font-size="24" font-weight="700">Audience + artifact</text>
  <text x="370" y="310" fill="#0b1225" font-family="Arial, sans-serif" font-size="21">Sources + limits</text>
  <text x="400" y="405" fill="#0b1225" font-family="Arial, sans-serif" font-size="22" font-weight="700">Testable result</text>
</svg>