<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <!-- Alt text: A flawed output is preserved, examined, revised against sources and criteria, and either approved or stopped for human review. -->
  <title id="title">Failure recovery</title>
  <desc id="desc">A recovery loop identifies a failure, revises the workflow, verifies the result, and stops when it is not safe.</desc>
  <rect width="1000" height="560" fill="#f6f3eb"/>
  <text x="65" y="75" fill="#0b1225" font-family="Arial, sans-serif" font-size="32" font-weight="700">RECOVER, THEN VERIFY</text>
  <rect x="80" y="190" width="190" height="120" rx="16" fill="#ff8c5a"/>
  <text x="112" y="245" fill="#0b1225" font-family="Arial, sans-serif" font-size="23" font-weight="700">FAILURE</text>
  <text x="105" y="278" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">preserve it</text>
  <rect x="330" y="190" width="190" height="120" rx="16" fill="#a99df7"/>
  <text x="358" y="245" fill="#0b1225" font-family="Arial, sans-serif" font-size="23" font-weight="700">DIAGNOSE</text>
  <text x="363" y="278" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">find the exact issue</text>
  <rect x="580" y="190" width="190" height="120" rx="16" fill="#63d7e4"/>
  <text x="622" y="245" fill="#0b1225" font-family="Arial, sans-serif" font-size="23" font-weight="700">REVISE</text>
  <text x="605" y="278" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">source or instruction</text>
  <rect x="830" y="190" width="110" height="120" rx="16" fill="#c9f25f"/>
  <text x="850" y="245" fill="#0b1225" font-family="Arial, sans-serif" font-size="21" font-weight="700">CHECK</text>
  <text x="850" y="278" fill="#0b1225" font-family="Arial, sans-serif" font-size="16">safe?</text>
  <path d="M270 250 H330 M520 250 H580 M770 250 H830" stroke="#0b1225" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M885 330 C885 440 180 465 180 315" fill="none" stroke="#0b1225" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="330" y="420" fill="#0b1225" font-family="Arial, sans-serif" font-size="21">If it is not safe or verified: stop and seek human review.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1225"/>
    </marker>
  </defs>
</svg>

---