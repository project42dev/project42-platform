<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <!-- Alt text: A source card flows into an AI workspace, then stops at a human approval gate before reaching a permitted final use. -->
  <title id="title">Authority boundary</title>
  <desc id="desc">The AI organizes approved information, while a human verifies and approves the final use.</desc>
  <rect width="1000" height="560" fill="#f6f3eb"/>
  <text x="65" y="78" fill="#0b1225" font-family="Arial, sans-serif" font-size="32" font-weight="700">AUTHORITY IS A BOUNDARY</text>
  <rect x="70" y="190" width="210" height="150" rx="18" fill="#63d7e4"/>
  <text x="115" y="250" fill="#0b1225" font-family="Arial, sans-serif" font-size="25" font-weight="700">SOURCE</text>
  <text x="103" y="290" fill="#0b1225" font-family="Arial, sans-serif" font-size="18">approved facts</text>
  <path d="M300 265 H390" stroke="#0b1225" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="410" y="190" width="210" height="150" rx="18" fill="#a99df7"/>
  <text x="470" y="250" fill="#0b1225" font-family="Arial, sans-serif" font-size="25" font-weight="700">AI</text>
  <text x="433" y="290" fill="#0b1225" font-family="Arial, sans-serif" font-size="18">organizes, drafts</text>
  <path d="M640 265 H730" stroke="#0b1225" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="750" y="160" width="170" height="210" rx="18" fill="#ff8c5a"/>
  <text x="780" y="225" fill="#0b1225" font-family="Arial, sans-serif" font-size="23" font-weight="700">HUMAN</text>
  <text x="775" y="265" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">verify</text>
  <text x="775" y="295" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">approve</text>
  <text x="775" y="325" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">decide</text>
  <text x="350" y="440" fill="#0b1225" font-family="Arial, sans-serif" font-size="21">Useful does not automatically mean authorized.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1225"/>
    </marker>
  </defs>
</svg>