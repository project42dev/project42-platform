<!-- Alt text: A navy AI product container holds a lime model circle and surrounding cards for instructions, context, retrieval, memory, tools, policy, and an optional agent loop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">AI product boundary map</title>
  <desc id="desc">A model sits inside a larger AI product with instructions, context, retrieval, memory, tools, policy, and an optional agent loop.</desc>
  <rect width="900" height="560" fill="#f6f3eb"/>
  <rect x="45" y="35" width="810" height="490" rx="28" fill="#0b1225"/>
  <text x="80" y="82" fill="#f6f3eb" font-family="Arial,sans-serif" font-size="28" font-weight="700">AI PRODUCT</text>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700">
    <rect x="85" y="125" width="170" height="58" rx="14" fill="#63d7e4"/><text x="170" y="161" text-anchor="middle" fill="#0b1225">Instructions</text>
    <rect x="85" y="215" width="170" height="58" rx="14" fill="#a99df7"/><text x="170" y="251" text-anchor="middle" fill="#0b1225">Context</text>
    <rect x="85" y="305" width="170" height="58" rx="14" fill="#ff8c5a"/><text x="170" y="341" text-anchor="middle" fill="#0b1225">Retrieval</text>
    <rect x="85" y="395" width="170" height="58" rx="14" fill="#c9f25f"/><text x="170" y="431" text-anchor="middle" fill="#0b1225">Memory</text>
    <rect x="645" y="125" width="170" height="58" rx="14" fill="#c9f25f"/><text x="730" y="161" text-anchor="middle" fill="#0b1225">Tools</text>
    <rect x="645" y="215" width="170" height="58" rx="14" fill="#63d7e4"/><text x="730" y="251" text-anchor="middle" fill="#0b1225">Policy</text>
    <rect x="645" y="305" width="170" height="58" rx="14" fill="#a99df7"/><text x="730" y="341" text-anchor="middle" fill="#0b1225">Agent loop?</text>
  </g>
  <circle cx="450" cy="285" r="112" fill="#c9f25f"/>
  <text x="450" y="278" text-anchor="middle" fill="#0b1225" font-family="Arial,sans-serif" font-size="30" font-weight="700">MODEL</text>
  <text x="450" y="309" text-anchor="middle" fill="#0b1225" font-family="Arial,sans-serif" font-size="16">generates an output</text>
  <g stroke="#f6f3eb" stroke-width="3" fill="none" opacity=".8">
    <path d="M255 154H330"/><path d="M255 244H330"/><path d="M255 334H330"/><path d="M255 424H330"/>
    <path d="M570 154H645"/><path d="M570 244H645"/><path d="M570 334H645"/>
  </g>
</svg>