<!-- Alt text: Eight colored failure cards surround a central "Evidence check" circle, showing that each failure mode requires a specific check. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">AI failure modes and evidence checks</title>
  <desc id="desc">Eight possible AI failure modes surround evidence checks, showing what to inspect for each.</desc>
  <rect width="1000" height="620" fill="#f6f3eb"/>
  <text x="500" y="58" text-anchor="middle" fill="#0b1225" font-family="Arial,sans-serif" font-size="30" font-weight="700">EACH FAILURE MODE NEEDS AN EVIDENCE CHECK</text>
  <circle cx="500" cy="315" r="100" fill="#0b1225"/>
  <text x="500" y="307" text-anchor="middle" fill="#c9f25f" font-family="Arial,sans-serif" font-size="25" font-weight="700">EVIDENCE</text>
  <text x="500" y="335" text-anchor="middle" fill="#f6f3eb" font-family="Arial,sans-serif" font-size="15">check the output</text>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g fill="#ff8c5a"><rect x="55" y="105" width="165" height="48" rx="12"/><text x="137" y="135" fill="#0b1225">Fabrication</text></g>
    <g fill="#63d7e4"><rect x="250" y="105" width="165" height="48" rx="12"/><text x="332" y="135" fill="#0b1225">Staleness</text></g>
    <g fill="#a99df7"><rect x="585" y="105" width="165" height="48" rx="12"/><text x="667" y="135" fill="#0b1225">Scope drift</text></g>
    <g fill="#c9f25f"><rect x="780" y="105" width="165" height="48" rx="12"/><text x="862" y="135" fill="#0b1225">Bias</text></g>
    <g fill="#63d7e4"><rect x="55" y="480" width="165" height="48" rx="12"/><text x="137" y="510" fill="#0b1225">Inconsistency</text></g>
    <g fill="#a99df7"><rect x="250" y="480" width="165" height="48" rx="12"/><text x="332" y="510" fill="#0b1225">Context failure</text></g>
    <g fill="#ff8c5a"><rect x="585" y="480" width="165" height="48" rx="12"/><text x="667" y="510" fill="#0b1225">Tool uncertainty</text></g>
    <g fill="#c9f25f"><rect x="780" y="480" width="165" height="48" rx="12"/><text x="862" y="510" fill="#0b1225">Untested code</text></g>
  </g>
  <g stroke="#0b1225" stroke-width="2" opacity=".55">
    <path d="M220 153L430 260M415 153L460 235M585 153L540 235M780 153L570 260M220 480L430 370M415 480L460 395M585 480L540 395M780 480L570 370"/>
  </g>
</svg>