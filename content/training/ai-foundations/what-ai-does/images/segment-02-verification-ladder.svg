<!-- Alt text: A four-step verification process shows how consequence, volatility, uncertainty, and reversibility determine whether to use a light check, source comparison, strong evidence, or human approval. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Verification process</title>
  <desc id="desc">Risk factors determine whether an AI output needs a light check, source comparison, strong evidence, or human approval.</desc>
  <rect width="900" height="560" fill="#f6f3eb"/>
  <text x="70" y="70" fill="#0b1225" font-family="Arial,sans-serif" font-size="32" font-weight="700">MATCH VERIFICATION TO RISK</text>
  <g font-family="Arial,sans-serif" font-size="17" font-weight="700">
    <rect x="70" y="115" width="190" height="48" rx="12" fill="#63d7e4"/><text x="165" y="145" text-anchor="middle" fill="#0b1225">Consequence</text>
    <rect x="70" y="178" width="190" height="48" rx="12" fill="#ff8c5a"/><text x="165" y="208" text-anchor="middle" fill="#0b1225">Volatility</text>
    <rect x="70" y="241" width="190" height="48" rx="12" fill="#a99df7"/><text x="165" y="271" text-anchor="middle" fill="#0b1225">Uncertainty</text>
    <rect x="70" y="304" width="190" height="48" rx="12" fill="#c9f25f"/><text x="165" y="334" text-anchor="middle" fill="#0b1225">Reversibility</text>
  </g>
  <path d="M285 139H355M285 202H355M285 265H355M285 328H355" stroke="#0b1225" stroke-width="3"/>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0b1225">
    <rect x="390" y="420" width="480" height="50" fill="#c9f25f" rx="8"/><text x="630" y="450" text-anchor="middle">Light check</text>
    <rect x="430" y="355" width="400" height="50" fill="#63d7e4" rx="8"/><text x="630" y="385" text-anchor="middle">Compare sources</text>
    <rect x="470" y="290" width="320" height="50" fill="#ff8c5a" rx="8"/><text x="630" y="320" text-anchor="middle">Strong evidence</text>
    <rect x="510" y="225" width="240" height="50" fill="#a99df7" rx="8"/><text x="630" y="255" text-anchor="middle">Human approval</text>
  </g>
  <text x="450" y="520" text-anchor="middle" fill="#0b1225" font-family="Arial,sans-serif" font-size="16">Higher risk → stronger evidence before use</text>
</svg>