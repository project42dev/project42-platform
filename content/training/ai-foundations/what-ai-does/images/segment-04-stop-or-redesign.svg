<!-- Alt text: A decision path moves from an AI output through evidence and risk review to four dispositions: use, verify, redesign, or stop. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Decide whether to use, verify, redesign, or stop</title>
  <desc id="desc">An AI output is assessed for evidence and risk, leading to use, verify, redesign, or stop.</desc>
  <rect width="1000" height="520" fill="#f6f3eb"/>
  <text x="500" y="62" text-anchor="middle" fill="#0b1225" font-family="Arial,sans-serif" font-size="31" font-weight="700">A SAFE DISPOSITION</text>
  <g font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="60" y="210" width="170" height="70" rx="16" fill="#0b1225"/><text x="145" y="253" fill="#f6f3eb">AI output</text>
    <rect x="300" y="210" width="190" height="70" rx="16" fill="#63d7e4"/><text x="395" y="253" fill="#0b1225">Evidence check</text>
    <rect x="560" y="210" width="170" height="70" rx="16" fill="#a99df7"/><text x="645" y="253" fill="#0b1225">Risk review</text>
    <rect x="805" y="105" width="135" height="58" rx="14" fill="#c9f25f"/><text x="872" y="141" fill="#0b1225">Use</text>
    <rect x="805" y="180" width="135" height="58" rx="14" fill="#63d7e4"/><text x="872" y="216" fill="#0b1225">Verify</text>
    <rect x="805" y="255" width="135" height="58" rx="14" fill="#ff8c5a"/><text x="872" y="291" fill="#0b1225">Redesign</text>
    <rect x="805" y="330" width="135" height="58" rx="14" fill="#0b1225"/><text x="872" y="366" fill="#f6f3eb">Stop</text>
  </g>
  <g fill="none" stroke="#0b1225" stroke-width="4">
    <path d="M230 245h70M490 245h70M730 245h45"/>
    <path d="M775 245L805 134M775 245L805 209M775 245L805 284M775 245L805 359"/>
  </g>
  <text x="500" y="430" text-anchor="middle" fill="#0b1225" font-family="Arial,sans-serif" font-size="17">If evidence is weak or the stakes are too high, do not force a “use” decision.</text>
</svg>

