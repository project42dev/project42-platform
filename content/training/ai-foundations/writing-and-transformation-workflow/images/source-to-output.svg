<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <!-- Alt text: An approved source passes through a transformation stage and a review check; unsupported details are diverted and stopped. -->
  <title id="title">Controlled transformation</title>
  <desc id="desc">Supported source content is transformed and checked; unsupported content is blocked.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#63d7e4"/>
    </marker>
    <marker id="arrow-lime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9f25f"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8c5a"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#f6f3eb"/>
  <rect x="45" y="135" width="175" height="150" rx="16" fill="#0b1225"/>
  <text x="82" y="205" fill="#f6f3eb" font-family="Arial" font-size="25" font-weight="700">SOURCE</text>
  <text x="82" y="245" fill="#63d7e4" font-family="Arial" font-size="19">approved facts</text>
  <path d="M235 210 H365" stroke="#63d7e4" stroke-width="8" fill="none" marker-end="url(#arrow-cyan)"/>
  <rect x="385" y="105" width="190" height="210" rx="18" fill="#a99df7"/>
  <text x="420" y="180" fill="#0b1225" font-family="Arial" font-size="22" font-weight="700">TRANSFORM</text>
  <text x="420" y="220" fill="#0b1225" font-family="Arial" font-size="18">format, tone,</text>
  <text x="420" y="248" fill="#0b1225" font-family="Arial" font-size="18">length, structure</text>
  <path d="M595 210 H690" stroke="#c9f25f" stroke-width="8" fill="none" marker-end="url(#arrow-lime)"/>
  <rect x="710" y="135" width="145" height="150" rx="16" fill="#c9f25f"/>
  <text x="735" y="200" fill="#0b1225" font-family="Arial" font-size="21" font-weight="700">CHECKED</text>
  <text x="745" y="238" fill="#0b1225" font-family="Arial" font-size="18">output</text>
  <path d="M480 325 V370 H250" stroke="#ff8c5a" stroke-width="6" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="290" y="400" fill="#0b1225" font-family="Arial" font-size="18">unsupported detail stopped</text>
</svg>