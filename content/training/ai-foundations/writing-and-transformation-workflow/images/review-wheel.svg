<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <!-- Alt text: A draft is at the center of five labeled review checks, with arrows pointing from each check toward the draft to show evaluation. -->
  <title id="title">Five-part review of a draft</title>
  <desc id="desc">Meaning, evidence, voice, accessibility, and disclosure checks evaluate a draft before approval.</desc>
  <defs>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b1225"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <circle cx="450" cy="250" r="92" fill="#0b1225"/>
  <text x="404" y="245" fill="#c9f25f" font-family="Arial" font-size="28" font-weight="700">DRAFT</text>
  <text x="382" y="278" fill="#f6f3eb" font-family="Arial" font-size="18">evaluate me</text>
  <g font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="370" y="35" width="160" height="55" rx="14" fill="#63d7e4"/>
    <text x="450" y="70" fill="#0b1225">Meaning</text>
    <rect x="90" y="125" width="160" height="55" rx="14" fill="#a99df7"/>
    <text x="170" y="160" fill="#0b1225">Evidence</text>
    <rect x="650" y="125" width="160" height="55" rx="14" fill="#ff8c5a"/>
    <text x="730" y="160" fill="#0b1225">Voice</text>
    <rect x="120" y="355" width="190" height="55" rx="14" fill="#c9f25f"/>
    <text x="215" y="390" fill="#0b1225">Accessibility</text>
    <rect x="590" y="355" width="190" height="55" rx="14" fill="#63d7e4"/>
    <text x="685" y="390" fill="#0b1225">Disclosure</text>
  </g>
  <g stroke="#0b1225" stroke-width="4" fill="none" marker-end="url(#arrow-navy)">
    <path d="M450 95 V150"/>
    <path d="M250 175 L370 215"/>
    <path d="M650 175 L530 215"/>
    <path d="M300 355 L390 315"/>
    <path d="M600 355 L510 315"/>
  </g>
</svg>

