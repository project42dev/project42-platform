<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <!-- Alt text: A writing brief guides a draft through transformation and review before it becomes an approved output. -->
  <title id="title">Writing brief guides controlled production</title>
  <desc id="desc">A brief identifies four controls, which guide drafting, transformation, and review toward an approved output.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#63d7e4"/>
    </marker>
    <marker id="arrow-lime" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9f25f"/>
    </marker>
  </defs>
  <rect width="1000" height="460" fill="#f6f3eb"/>
  <rect x="35" y="55" width="295" height="330" rx="20" fill="#0b1225"/>
  <text x="70" y="105" fill="#c9f25f" font-family="Arial" font-size="27" font-weight="700">WRITING BRIEF</text>
  <g font-family="Arial" font-size="21" fill="#f6f3eb">
    <text x="75" y="165">Audience</text>
    <text x="75" y="215">Purpose</text>
    <text x="75" y="265">Source of truth</text>
    <text x="75" y="315">Acceptance criteria</text>
  </g>
  <path d="M350 220 H455" stroke="#63d7e4" stroke-width="8" fill="none" marker-end="url(#arrow-cyan)"/>
  <rect x="475" y="150" width="145" height="140" rx="18" fill="#a99df7"/>
  <text x="500" y="205" fill="#0b1225" font-family="Arial" font-size="22" font-weight="700">DRAFT</text>
  <text x="500" y="240" fill="#0b1225" font-family="Arial" font-size="18">transform</text>
  <path d="M640 220 H745" stroke="#63d7e4" stroke-width="8" fill="none" marker-end="url(#arrow-cyan)"/>
  <rect x="765" y="150" width="145" height="140" rx="18" fill="#63d7e4"/>
  <text x="788" y="205" fill="#0b1225" font-family="Arial" font-size="21" font-weight="700">CHECKED</text>
  <text x="794" y="240" fill="#0b1225" font-family="Arial" font-size="18">output</text>
  <path d="M838 310 V365" stroke="#c9f25f" stroke-width="8" fill="none" marker-end="url(#arrow-lime)"/>
  <text x="755" y="410" fill="#0b1225" font-family="Arial" font-size="20" font-weight="700">APPROVED</text>
</svg>