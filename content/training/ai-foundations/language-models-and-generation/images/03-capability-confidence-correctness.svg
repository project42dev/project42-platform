<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <!-- Alt text: Three separate panels distinguish capability, confidence, and correctness, followed by a verification step that checks claims against evidence. -->
  <title id="title">Capability, confidence, and correctness</title>
  <desc id="desc">Capability asks whether the model can perform a task. Confidence describes how certain the wording sounds. Correctness asks whether the answer is supported by evidence. Verification checks the claim.</desc>
  <rect width="1200" height="650" fill="#f6f3eb"/>
  <text x="65" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b1225">Three questions for every response</text>

  <rect x="65" y="135" width="320" height="285" rx="22" fill="#63d7e4"/>
  <text x="225" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1225">Capability</text>
  <text x="225" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Can the model</text>
  <text x="225" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">perform this task?</text>
  <text x="225" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Possible output ≠ proof</text>

  <rect x="440" y="135" width="320" height="285" rx="22" fill="#a99df7"/>
  <text x="600" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1225">Confidence</text>
  <text x="600" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">How certain does</text>
  <text x="600" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">the wording sound?</text>
  <text x="600" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Tone is not evidence</text>

  <rect x="815" y="135" width="320" height="285" rx="22" fill="#ff8c5a"/>
  <text x="975" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1225">Correctness</text>
  <text x="975" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Do claims match</text>
  <text x="975" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">dependable evidence?</text>
  <text x="975" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Check the source</text>

  <path d="M600 420 V500" stroke="#0b1225" stroke-width="8"/>
  <path d="M585 490 L600 510 L615 490" fill="none" stroke="#0b1225" stroke-width="8"/>
  <rect x="405" y="520" width="390" height="70" rx="16" fill="#0b1225"/>
  <text x="600" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#c9f25f">Verify before relying on it</text>
</svg>