<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <!-- Alt text: A left-to-right sequence shows a prompt becoming a response one token at a time, with each selected token added before the next prediction. -->
  <title id="title">Token-by-token generation</title>
  <desc id="desc">A model starts with a prompt, predicts a next token, appends it to the partial response, and repeats until it stops.</desc>
  <rect width="1200" height="620" fill="#f6f3eb"/>
  <text x="65" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b1225">A response grows one token at a time</text>

  <rect x="65" y="160" width="220" height="115" rx="18" fill="#0b1225"/>
  <text x="175" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#f6f3eb">Prompt and</text>
  <text x="175" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#f6f3eb">context</text>

  <path d="M285 218 H365" stroke="#0b1225" stroke-width="8"/>
  <path d="M355 202 L375 218 L355 234" fill="none" stroke="#0b1225" stroke-width="8"/>

  <rect x="375" y="160" width="220" height="115" rx="18" fill="#a99df7"/>
  <text x="485" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Estimate the</text>
  <text x="485" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">next token</text>

  <path d="M595 218 H675" stroke="#0b1225" stroke-width="8"/>
  <path d="M665 202 L685 218 L665 234" fill="none" stroke="#0b1225" stroke-width="8"/>

  <rect x="685" y="160" width="220" height="115" rx="18" fill="#c9f25f"/>
  <text x="795" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Choose and</text>
  <text x="795" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">append token</text>

  <path d="M905 218 H985" stroke="#0b1225" stroke-width="8"/>
  <path d="M975 202 L995 218 L975 234" fill="none" stroke="#0b1225" stroke-width="8"/>

  <rect x="995" y="160" width="145" height="115" rx="18" fill="#63d7e4"/>
  <text x="1067" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#0b1225">Partial</text>
  <text x="1067" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#0b1225">response</text>

  <path d="M1067 275 V390 H485 V285" fill="none" stroke="#ff8c5a" stroke-width="7"/>
  <path d="M475 295 L485 275 L495 295" fill="none" stroke="#ff8c5a" stroke-width="7"/>
  <text x="630" y="375" font-family="Arial, sans-serif" font-size="22" fill="#ff8c5a">Repeat with the expanded text</text>

  <rect x="420" y="470" width="360" height="70" rx="16" fill="#0b1225"/>
  <text x="600" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#c9f25f">Stop condition → final response</text>
</svg>