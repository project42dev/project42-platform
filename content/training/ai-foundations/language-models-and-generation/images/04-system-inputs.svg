<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <!-- Alt text: Prompt, conversation history, supplied context, system instructions, and available settings converge on a language model and shape its generated response. -->
  <title id="title">Many inputs shape a response</title>
  <desc id="desc">Several inputs enter a language model: the prompt, conversation history, supplied context, system instructions, and available settings. The model produces a generated response for review.</desc>
  <rect width="1200" height="680" fill="#f6f3eb"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b1225">The surrounding system shapes the output</text>

  <rect x="65" y="125" width="245" height="70" rx="14" fill="#ff8c5a"/>
  <text x="187" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">User prompt</text>

  <rect x="65" y="225" width="245" height="70" rx="14" fill="#63d7e4"/>
  <text x="187" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Conversation history</text>

  <rect x="65" y="325" width="245" height="70" rx="14" fill="#c9f25f"/>
  <text x="187" y="369" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Supplied context</text>

  <rect x="65" y="425" width="245" height="70" rx="14" fill="#a99df7"/>
  <text x="187" y="469" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">System instructions</text>

  <rect x="65" y="525" width="245" height="70" rx="14" fill="#ff8c5a"/>
  <text x="187" y="569" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#0b1225">Available settings</text>

  <path d="M310 160 H475 M310 260 H475 M310 360 H475 M310 460 H475 M310 560 H475" stroke="#0b1225" stroke-width="6" fill="none"/>
  <path d="M465 145 L485 160 L465 175 M465 245 L485 260 L465 275 M465 345 L485 360 L465 375 M465 445 L485 460 L465 475 M465 545 L485 560 L465 575" stroke="#0b1225" stroke-width="6" fill="none"/>

  <rect x="485" y="245" width="285" height="190" rx="24" fill="#0b1225"/>
  <text x="627" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#c9f25f">Language</text>
  <text x="627" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#c9f25f">model</text>
  <text x="627" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#f6f3eb">generates token by token</text>

  <path d="M770 340 H900" stroke="#0b1225" stroke-width="8" fill="none"/>
  <path d="M890 325 L910 340 L890 355" stroke="#0b1225" stroke-width="8" fill="none"/>
  <rect x="910" y="285" width="225" height="110" rx="18" fill="#63d7e4"/>
  <text x="1022" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#0b1225">Generated</text>
  <text x="1022" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#0b1225">response</text>

  <path d="M1022 395 V510 H770" stroke="#ff8c5a" stroke-width="7" fill="none"/>
  <path d="M780 495 L760 510 L780 525" stroke="#ff8c5a" stroke-width="7" fill="none"/>
  <text x="830" y="548" font-family="Arial, sans-serif" font-size="21" fill="#ff8c5a">Review and verify</text>
</svg>

