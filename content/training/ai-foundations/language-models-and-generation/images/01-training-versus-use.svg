<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <!-- Alt text: A two-part diagram contrasts training, where language examples shape learned parameters, with use, where a prompt and context are transformed into a generated response. -->
  <title id="title">Training versus using a language model</title>
  <desc id="desc">Language examples flow through training into learned parameters, which are the trained model. A prompt and context then meet the trained model and produce a response.</desc>
  <rect width="1200" height="650" fill="#f6f3eb"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0b1225">Two different phases</text>

  <rect x="70" y="125" width="480" height="430" rx="24" fill="#0b1225"/>
  <text x="105" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#c9f25f">TRAINING</text>
  <rect x="110" y="230" width="175" height="90" rx="14" fill="#63d7e4"/>
  <text x="197" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#0b1225">Language</text>
  <text x="197" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">examples</text>
  <path d="M285 275 H370" stroke="#c9f25f" stroke-width="8" fill="none"/>
  <path d="M360 260 L380 275 L360 290" stroke="#c9f25f" stroke-width="8" fill="none"/>
  <rect x="380" y="230" width="125" height="90" rx="14" fill="#a99df7"/>
  <text x="442" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Learned</text>
  <text x="442" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">parameters</text>
  <text x="110" y="395" font-family="Arial, sans-serif" font-size="21" fill="#f6f3eb">Patterns are adjusted during</text>
  <text x="110" y="427" font-family="Arial, sans-serif" font-size="21" fill="#f6f3eb">the training process.</text>

  <rect x="650" y="125" width="480" height="430" rx="24" fill="#f6f3eb" stroke="#0b1225" stroke-width="4"/>
  <text x="685" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0b1225">USING</text>
  <rect x="690" y="230" width="150" height="90" rx="14" fill="#ff8c5a"/>
  <text x="765" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#0b1225">Prompt +</text>
  <text x="765" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">context</text>
  <path d="M840 275 H925" stroke="#0b1225" stroke-width="8" fill="none"/>
  <path d="M915 260 L935 275 L915 290" stroke="#0b1225" stroke-width="8" fill="none"/>
  <rect x="935" y="230" width="150" height="90" rx="14" fill="#63d7e4"/>
  <text x="1010" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Generated</text>
  <text x="1010" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">response</text>
  <text x="690" y="395" font-family="Arial, sans-serif" font-size="21" fill="#0b1225">The trained model uses what it learned</text>
  <text x="690" y="427" font-family="Arial, sans-serif" font-size="21" fill="#0b1225">to produce new text.</text>
</svg>