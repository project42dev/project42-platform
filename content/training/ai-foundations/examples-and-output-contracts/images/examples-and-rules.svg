<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <!-- Alt text: A navy canvas shows three varied example cards feeding into a central lime governing-rule card, which leads to a cyan desired-behavior card. An orange accidental-detail card is separated from the main flow. -->
  <title id="title">Examples demonstrate a governing rule</title>
  <desc id="desc">Three varied examples point to a governing rule, which produces desired behavior while accidental details are excluded.</desc>
  <rect width="1200" height="700" fill="#0b1225"/>
  <text x="70" y="75" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Examples should reveal the rule</text>

  <g font-family="Arial, sans-serif" font-size="24">
    <rect x="70" y="145" width="270" height="100" rx="18" fill="#a99df7"/>
    <text x="100" y="187" fill="#0b1225">Example 01</text>
    <text x="100" y="220" fill="#0b1225" font-size="19">clear case</text>

    <rect x="70" y="285" width="270" height="100" rx="18" fill="#a99df7"/>
    <text x="100" y="327" fill="#0b1225">Example 02</text>
    <text x="100" y="360" fill="#0b1225" font-size="19">counterexample</text>

    <rect x="70" y="425" width="270" height="100" rx="18" fill="#a99df7"/>
    <text x="100" y="467" fill="#0b1225">Example 03</text>
    <text x="100" y="500" fill="#0b1225" font-size="19">edge case</text>

    <path d="M340 195 H445 M340 335 H445 M340 475 H445" stroke="#c9f25f" stroke-width="5" fill="none"/>
    <polygon points="445,195 430,185 430,205" fill="#c9f25f"/>
    <polygon points="445,335 430,325 430,345" fill="#c9f25f"/>
    <polygon points="445,475 430,465 430,485" fill="#c9f25f"/>

    <rect x="465" y="270" width="300" height="130" rx="20" fill="#c9f25f"/>
    <text x="515" y="320" fill="#0b1225" font-weight="700">Governing rule</text>
    <text x="515" y="356" fill="#0b1225" font-size="19">What decides?</text>

    <path d="M765 335 H890" stroke="#63d7e4" stroke-width="5" fill="none"/>
    <polygon points="890,335 875,325 875,345" fill="#63d7e4"/>

    <rect x="910" y="270" width="220" height="130" rx="20" fill="#63d7e4"/>
    <text x="950" y="320" fill="#0b1225" font-weight="700">Desired</text>
    <text x="950" y="356" fill="#0b1225">behavior</text>

    <rect x="830" y="500" width="300" height="80" rx="16" fill="#ff8c5a"/>
    <text x="870" y="548" fill="#0b1225" font-size="20">Accidental detail ≠ rule</text>
  </g>
</svg>