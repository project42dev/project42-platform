<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <!-- Alt text: Nested navy, violet, cyan, and lime shapes show increasingly strict output requirements: presentation, valid JSON, and schema-constrained data. Each inner layer adds precision and restrictiveness. -->
  <title id="title">Increasingly strict output contracts</title>
  <desc id="desc">Nested layers move from a broad formatting request to valid JSON and then to schema-constrained output with required fields and types.</desc>
  <rect width="1200" height="700" fill="#0b1225"/>
  <text x="70" y="70" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Output requirements add precision</text>

  <rect x="90" y="125" width="1020" height="500" rx="30" fill="#a99df7"/>
  <text x="135" y="180" fill="#0b1225" font-family="Arial, sans-serif" font-size="28" font-weight="700">Formatting request</text>
  <text x="135" y="214" fill="#0b1225" font-family="Arial, sans-serif" font-size="19">Readable bullets, paragraphs, or ordering</text>

  <rect x="205" y="250" width="790" height="310" rx="26" fill="#63d7e4"/>
  <text x="250" y="310" fill="#0b1225" font-family="Arial, sans-serif" font-size="28" font-weight="700">Valid JSON</text>
  <text x="250" y="344" fill="#0b1225" font-family="Arial, sans-serif" font-size="19">One correctly formed, parseable value</text>

  <rect x="335" y="385" width="530" height="135" rx="22" fill="#c9f25f"/>
  <text x="380" y="438" fill="#0b1225" font-family="Arial, sans-serif" font-size="26" font-weight="700">Schema contract</text>
  <text x="380" y="472" fill="#0b1225" font-family="Arial, sans-serif" font-size="18">Fields, types, values, and limits</text>

  <rect x="930" y="535" width="140" height="48" rx="12" fill="#ff8c5a"/>
  <text x="955" y="566" fill="#0b1225" font-family="Arial, sans-serif" font-size="16">stricter inward</text>
</svg>