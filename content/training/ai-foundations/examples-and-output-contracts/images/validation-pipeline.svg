<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <!-- Alt text: A left-to-right validation pipeline moves an AI response through parsing, contract checks, and content and edge-case checks before acceptance. Every failure branch loops back toward repair and resubmission. -->
  <title id="title">Output validation pipeline</title>
  <desc id="desc">Responses are parsed, checked against the contract, checked for content and edge cases, and accepted only after all checks pass; failures lead to repair and resubmission.</desc>
  <rect width="1500" height="700" fill="#0b1225"/>
  <text x="60" y="70" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Validate in stages</text>

  <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle">
    <rect x="55" y="250" width="190" height="100" rx="18" fill="#a99df7"/>
    <text x="150" y="292" fill="#0b1225">AI response</text>
    <text x="150" y="324" fill="#0b1225" font-size="17">candidate output</text>

    <rect x="330" y="250" width="220" height="100" rx="18" fill="#63d7e4"/>
    <text x="440" y="292" fill="#0b1225">Parse structure</text>
    <text x="440" y="324" fill="#0b1225" font-size="17">JSON or requested form</text>

    <rect x="640" y="250" width="220" height="100" rx="18" fill="#63d7e4"/>
    <text x="750" y="292" fill="#0b1225">Check contract</text>
    <text x="750" y="324" fill="#0b1225" font-size="17">fields and types</text>

    <rect x="950" y="250" width="260" height="100" rx="18" fill="#c9f25f"/>
    <text x="1080" y="292" fill="#0b1225">Check content</text>
    <text x="1080" y="324" fill="#0b1225" font-size="17">facts and edge cases</text>

    <rect x="1290" y="250" width="155" height="100" rx="18" fill="#c9f25f"/>
    <text x="1367" y="308" fill="#0b1225">Accept</text>

    <path d="M245 300 H330 M550 300 H640 M860 300 H950 M1210 300 H1290" stroke="#c9f25f" stroke-width="5" fill="none"/>
    <polygon points="330,300 315,290 315,310" fill="#c9f25f"/>
    <polygon points="640,300 625,290 625,310" fill="#c9f25f"/>
    <polygon points="950,300 935,290 935,310" fill="#c9f25f"/>
    <polygon points="1290,300 1275,290 1275,310" fill="#c9f25f"/>

    <rect x="420" y="470" width="245" height="90" rx="18" fill="#ff8c5a"/>
    <text x="542" y="508" fill="#0b1225">Repair or reject</text>
    <text x="542" y="538" fill="#0b1225" font-size="17">then resubmit</text>

    <rect x="1010" y="470" width="245" height="90" rx="18" fill="#ff8c5a"/>
    <text x="1132" y="508" fill="#0b1225">Clarify or revise</text>
    <text x="1132" y="538" fill="#0b1225" font-size="17">then resubmit</text>

    <path d="M440 350 V470 M750 350 V470 M1080 350 V470" stroke="#ff8c5a" stroke-width="5" fill="none"/>
    <polygon points="440,470 430,455 450,455" fill="#ff8c5a"/>
    <polygon points="750,470 740,455 760,455" fill="#ff8c5a"/>
    <polygon points="1080,470 1070,455 1090,455" fill="#ff8c5a"/>

    <path d="M420 515 H150 V350" stroke="#ff8c5a" stroke-width="4" fill="none"/>
    <polygon points="150,350 140,365 160,365" fill="#ff8c5a"/>
    <path d="M1010 515 H150 V350" stroke="#ff8c5a" stroke-width="4" fill="none"/>
  </g>
</svg>

---