<!-- Alt text: A response is divided into separate claims, and each claim is connected to nearby evidence and a verification status. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Claim map</title>
  <desc id="desc">A response is divided into three claims. Each claim is connected to evidence and a verification status.</desc>
  <rect width="900" height="520" fill="#f6f3eb"/>
  <rect x="40" y="185" width="190" height="120" rx="18" fill="#0b1225"/>
  <text x="135" y="235" text-anchor="middle" fill="#f6f3eb" font-family="Arial" font-size="24">Response</text>
  <text x="135" y="270" text-anchor="middle" fill="#c9f25f" font-family="Arial" font-size="18">split into claims</text>

  <g stroke="#0b1225" stroke-width="4" fill="none">
    <path d="M230 215 H315"/>
    <path d="M230 245 H315"/>
    <path d="M230 275 H315"/>
    <path d="M525 135 H625"/>
    <path d="M525 260 H625"/>
    <path d="M525 385 H625"/>
  </g>

  <g fill="#63d7e4" stroke="#0b1225" stroke-width="3">
    <rect x="315" y="100" width="210" height="70" rx="14"/>
    <rect x="315" y="225" width="210" height="70" rx="14"/>
    <rect x="315" y="350" width="210" height="70" rx="14"/>
  </g>
  <g fill="#0b1225" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="420" y="130">Claim 1: fact</text>
    <text x="420" y="153">or summary</text>
    <text x="420" y="255">Claim 2: calculation</text>
    <text x="420" y="278">or interpretation</text>
    <text x="420" y="380">Claim 3: prediction</text>
    <text x="420" y="403">or recommendation</text>
  </g>

  <g fill="#a99df7" stroke="#0b1225" stroke-width="3">
    <rect x="625" y="100" width="190" height="70" rx="14"/>
    <rect x="625" y="225" width="190" height="70" rx="14"/>
    <rect x="625" y="350" width="190" height="70" rx="14"/>
  </g>
  <g fill="#0b1225" font-family="Arial" font-size="18" text-anchor="middle">
    <text x="720" y="130">Evidence</text><text x="720" y="153">attached</text>
    <text x="720" y="255">Source</text><text x="720" y="278">checked</text>
    <text x="720" y="380">Unsupported</text><text x="720" y="403">or qualified</text>
  </g>
</svg>