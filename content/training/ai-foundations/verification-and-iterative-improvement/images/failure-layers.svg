<!-- Alt text: Six connected workflow layers—task, context, prompt, model, source, and review—show possible locations where an AI response failure entered. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Failure diagnosis layers</title>
  <desc id="desc">Six connected layers help locate where a response failure entered the workflow.</desc>
  <rect width="900" height="520" fill="#f6f3eb"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="29" fill="#0b1225">Where did the miss enter?</text>

  <g stroke="#0b1225" stroke-width="3">
    <rect x="90" y="100" width="210" height="80" rx="14" fill="#a99df7"/>
    <rect x="345" y="100" width="210" height="80" rx="14" fill="#63d7e4"/>
    <rect x="600" y="100" width="210" height="80" rx="14" fill="#c9f25f"/>
    <rect x="90" y="270" width="210" height="80" rx="14" fill="#ff8c5a"/>
    <rect x="345" y="270" width="210" height="80" rx="14" fill="#a99df7"/>
    <rect x="600" y="270" width="210" height="80" rx="14" fill="#63d7e4"/>
  </g>
  <g font-family="Arial" font-size="22" fill="#0b1225" text-anchor="middle">
    <text x="195" y="148">Task</text>
    <text x="450" y="148">Context</text>
    <text x="705" y="148">Prompt</text>
    <text x="195" y="318">Model</text>
    <text x="450" y="318">Source</text>
    <text x="705" y="318">Review</text>
  </g>
  <g stroke="#0b1225" stroke-width="4" fill="none">
    <path d="M300 140 H345"/>
    <path d="M555 140 H600"/>
    <path d="M705 180 V270"/>
    <path d="M600 310 H555"/>
    <path d="M345 310 H300"/>
  </g>
  <text x="450" y="430" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b1225">Trace the workflow before assigning blame</text>
</svg>