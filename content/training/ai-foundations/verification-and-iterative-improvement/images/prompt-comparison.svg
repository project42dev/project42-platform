<!-- Alt text: Two prompt versions are tested on the same representative cases, scored with the same criteria, and compared for improvements and regressions. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Prompt comparison loop</title>
  <desc id="desc">Two prompt versions run against the same cases. Their outputs are scored with identical criteria and compared for improvements and regressions.</desc>
  <rect width="1000" height="560" fill="#f6f3eb"/>
  <text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="30" fill="#0b1225">Compare prompt versions</text>

  <g stroke="#0b1225" stroke-width="3">
    <rect x="60" y="210" width="180" height="80" rx="16" fill="#c9f25f"/>
    <rect x="340" y="110" width="180" height="80" rx="16" fill="#63d7e4"/>
    <rect x="340" y="310" width="180" height="80" rx="16" fill="#a99df7"/>
    <rect x="650" y="210" width="180" height="80" rx="16" fill="#ff8c5a"/>
  </g>
  <g fill="#0b1225" font-family="Arial" font-size="20" text-anchor="middle">
    <text x="150" y="243">Same cases</text>
    <text x="150" y="268">representative set</text>
    <text x="430" y="143">Prompt V1</text>
    <text x="430" y="343">Prompt V2</text>
    <text x="740" y="243">Same scorecard</text>
    <text x="740" y="268">compare results</text>
  </g>
  <g stroke="#0b1225" stroke-width="4" fill="none">
    <path d="M240 235 C285 180 300 160 340 150"/>
    <path d="M240 265 C285 320 300 340 340 350"/>
    <path d="M520 150 C590 150 600 215 650 235"/>
    <path d="M520 350 C590 350 600 285 650 265"/>
  </g>
  <rect x="340" y="445" width="320" height="55" rx="14" fill="#0b1225"/>
  <text x="500" y="480" text-anchor="middle" font-family="Arial" font-size="19" fill="#c9f25f">Keep, revise, and test again</text>
</svg>

