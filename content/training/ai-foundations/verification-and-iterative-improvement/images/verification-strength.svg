<!-- Alt text: A three-step ladder shows verification increasing from a light check to a direct source check and then a second review for high-consequence claims. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Verification strength ladder</title>
  <desc id="desc">Verification strength increases from a light check to a direct source check and then to a direct check plus a second review.</desc>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial" font-size="30" fill="#0b1225">Match the check to the risk</text>
  <path d="M140 400 L140 300 L360 300 L360 210 L580 210 L580 120 L800 120" fill="none" stroke="#0b1225" stroke-width="8"/>

  <g font-family="Arial" fill="#0b1225" text-anchor="middle" stroke="#0b1225" stroke-width="3">
    <rect x="65" y="330" width="150" height="65" rx="15" fill="#c9f25f"/>
    <rect x="285" y="240" width="150" height="65" rx="15" fill="#63d7e4"/>
    <rect x="505" y="150" width="150" height="65" rx="15" fill="#ff8c5a"/>
  </g>
  <g font-family="Arial" fill="#0b1225" text-anchor="middle">
    <text x="140" y="357" font-size="19">Light check</text>
    <text x="140" y="380" font-size="15">low risk</text>
    <text x="360" y="267" font-size="19">Source check</text>
    <text x="360" y="290" font-size="15">current claim</text>
    <text x="580" y="177" font-size="19">Strong check</text>
    <text x="580" y="200" font-size="15">high consequence</text>
  </g>
  <text x="700" y="95" text-anchor="middle" font-family="Arial" font-size="18" fill="#0b1225">second review</text>
</svg>