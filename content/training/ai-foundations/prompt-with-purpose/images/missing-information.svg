<!-- Alt text: A decision path shows that provided information can be used, while missing information is labeled, questioned, or handled conditionally instead of being guessed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Handle missing information</title>
  <desc id="desc">Provided information is used and attributed; missing information is marked, questioned, or handled conditionally.</desc>
  <rect width="1000" height="600" fill="#f6f3eb"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#0b1225">When information is missing</text>
  <rect x="350" y="100" width="300" height="70" rx="18" fill="#a99df7"/>
  <text x="500" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1225">Is it provided?</text>
  <path d="M350 135 H190 V230" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 135 H810 V230" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="245" y="122" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">Yes</text>
  <text x="725" y="122" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">No</text>
  <rect x="60" y="230" width="260" height="100" rx="18" fill="#c9f25f"/>
  <text x="190" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1225">Use and</text>
  <text x="190" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1225">attribute it</text>
  <rect x="680" y="230" width="260" height="100" rx="18" fill="#ff8c5a"/>
  <text x="810" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1225">Mark as</text>
  <text x="810" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1225">not provided</text>
  <path d="M810 330 V405 H650" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M810 330 V405 H810" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="500" y="405" width="300" height="80" rx="18" fill="#63d7e4"/>
  <text x="650" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1225">Ask a focused</text>
  <text x="650" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1225">question</text>
  <rect x="820" y="405" width="140" height="80" rx="18" fill="#a99df7"/>
  <text x="890" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1225">Conditional</text>
  <text x="890" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0b1225">answer</text>
  <path d="M190 330 V540 H500" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M650 485 V540 H500" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M890 485 V540 H500" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="350" y="520" width="300" height="55" rx="18" fill="#0b1225"/>
  <text x="500" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f6f3eb">Inspectable result</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b1225"/>
    </marker>
  </defs>
</svg>

---