<!-- Alt text: A circular improvement loop moves from prompt to result to inspection, then makes one small revision before running again. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Inspect and revise loop</title>
  <desc id="desc">A four-step loop improves a prompt through focused inspection and one small change.</desc>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0b1225">Improve one controllable part</text>
  <circle cx="450" cy="270" r="145" fill="none" stroke="#0b1225" stroke-width="6" stroke-dasharray="18 12"/>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0b1225">
    <rect x="350" y="95" width="200" height="66" rx="15" fill="#c9f25f"/>
    <text x="450" y="136">Run prompt</text>
    <rect x="590" y="235" width="200" height="66" rx="15" fill="#63d7e4"/>
    <text x="690" y="276">Inspect result</text>
    <rect x="350" y="379" width="200" height="66" rx="15" fill="#ff8c5a"/>
    <text x="450" y="420">Change one instruction</text>
    <rect x="110" y="235" width="200" height="66" rx="15" fill="#a99df7"/>
    <text x="210" y="276">Compare versions</text>
  </g>
  <path d="M550 130 C650 145 705 175 710 235" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M690 301 C660 370 600 405 550 410" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M350 410 C275 395 220 350 210 301" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M210 235 C235 170 285 140 350 130" fill="none" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b1225"/>
    </marker>
  </defs>
</svg>