<!-- Alt text: A left-to-right flow shows a vague topic becoming a purposeful prompt through a named user, a decision, context, constraints, and success criteria. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Prompt with purpose</title>
  <desc id="desc">A sequence transforms a vague topic into a purposeful prompt.</desc>
  <rect width="1200" height="360" fill="#f6f3eb"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0b1225">From topic to useful outcome</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0b1225" text-anchor="middle">
    <rect x="55" y="125" width="150" height="100" rx="16" fill="#63d7e4"/>
    <text x="130" y="165"><tspan x="130">Vague</tspan><tspan x="130" dy="25">topic</tspan></text>
    <path d="M205 175 H250" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="250" y="125" width="150" height="100" rx="16" fill="#a99df7"/>
    <text x="325" y="165"><tspan x="325">Named</tspan><tspan x="325" dy="25">user</tspan></text>
    <path d="M400 175 H445" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="445" y="125" width="150" height="100" rx="16" fill="#c9f25f"/>
    <text x="520" y="165"><tspan x="520">Decision</tspan><tspan x="520" dy="25">to support</tspan></text>
    <path d="M595 175 H640" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="640" y="125" width="150" height="100" rx="16" fill="#ff8c5a"/>
    <text x="715" y="165"><tspan x="715">Relevant</tspan><tspan x="715" dy="25">context</tspan></text>
    <path d="M790 175 H835" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="835" y="125" width="150" height="100" rx="16" fill="#63d7e4"/>
    <text x="910" y="165"><tspan x="910">Constraints</tspan><tspan x="910" dy="25">and format</tspan></text>
    <path d="M985 175 H1030" stroke="#0b1225" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1030" y="125" width="120" height="100" rx="16" fill="#c9f25f"/>
    <text x="1090" y="165"><tspan x="1090">Checkable</tspan><tspan x="1090" dy="25">result</tspan></text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b1225"/>
    </marker>
  </defs>
</svg>