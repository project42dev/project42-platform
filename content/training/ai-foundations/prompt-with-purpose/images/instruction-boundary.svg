<!-- Alt text: A prompt is divided into trusted instructions and a clearly delimited source-content area; arrows show that source content is analyzed as evidence and cannot redefine the task. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Instruction and content boundary</title>
  <desc id="desc">Trusted instructions guide the task while source content remains material to analyze.</desc>
  <rect width="1000" height="520" fill="#f6f3eb"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0b1225">Keep the task boundary visible</text>
  <rect x="70" y="100" width="370" height="290" rx="18" fill="#0b1225"/>
  <text x="105" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c9f25f">TRUSTED INSTRUCTIONS</text>
  <text x="105" y="195" font-family="Arial, sans-serif" font-size="19" fill="#f6f3eb">Task</text>
  <text x="105" y="235" font-family="Arial, sans-serif" font-size="19" fill="#f6f3eb">Audience and decision</text>
  <text x="105" y="275" font-family="Arial, sans-serif" font-size="19" fill="#f6f3eb">Output requirements</text>
  <text x="105" y="315" font-family="Arial, sans-serif" font-size="19" fill="#f6f3eb">Missing-information behavior</text>
  <rect x="560" y="100" width="370" height="290" rx="18" fill="#63d7e4"/>
  <text x="595" y="145" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1225">SOURCE CONTENT</text>
  <text x="595" y="195" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Documents</text>
  <text x="595" y="235" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Messages</text>
  <text x="595" y="275" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Feedback</text>
  <text x="595" y="315" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Evidence to analyze</text>
  <path d="M440 245 H560" stroke="#ff8c5a" stroke-width="8" stroke-dasharray="14 10"/>
  <text x="500" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0b1225">boundary</text>
  <rect x="285" y="430" width="430" height="52" rx="26" fill="#a99df7"/>
  <text x="500" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1225">Analyze content; follow the task</text>
</svg>