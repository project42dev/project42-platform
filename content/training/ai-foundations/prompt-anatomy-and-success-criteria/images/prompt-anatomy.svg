<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <!-- Alt text: A navy canvas shows purpose and inputs flowing in parallel into instructions, followed by constraints, deliverable, and verification. -->
  <title id="title">Prompt anatomy</title>
  <desc id="desc">Purpose and Inputs are parallel components that connect to Instructions, followed by Constraints, Deliverable, and Verification.</desc>
  <rect width="1200" height="675" fill="#0b1225"/>
  <text x="72" y="88" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="44" font-weight="700">Prompt anatomy</text>
  <text x="74" y="128" fill="#c9f25f" font-family="Arial, sans-serif" font-size="21">Purpose and inputs shape the work together</text>

  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="70" y="205" width="190" height="105" rx="18" fill="#c9f25f"/>
    <text x="165" y="252" fill="#0b1225" font-size="25">Purpose</text>
    <text x="165" y="282" fill="#0b1225" font-size="17">Why?</text>

    <rect x="70" y="370" width="190" height="105" rx="18" fill="#63d7e4"/>
    <text x="165" y="417" fill="#0b1225" font-size="25">Inputs</text>
    <text x="165" y="447" fill="#0b1225" font-size="17">What is available?</text>

    <rect x="355" y="285" width="190" height="105" rx="18" fill="#ff8c5a"/>
    <text x="450" y="332" fill="#0b1225" font-size="25">Instructions</text>
    <text x="450" y="362" fill="#0b1225" font-size="17">What work?</text>

    <rect x="640" y="285" width="170" height="105" rx="18" fill="#a99df7"/>
    <text x="725" y="332" fill="#0b1225" font-size="25">Constraints</text>
    <text x="725" y="362" fill="#0b1225" font-size="17">What limits?</text>

    <rect x="905" y="285" width="170" height="105" rx="18" fill="#c9f25f"/>
    <text x="990" y="332" fill="#0b1225" font-size="25">Deliverable</text>
    <text x="990" y="362" fill="#0b1225" font-size="17">What form?</text>

    <rect x="1095" y="285" width="85" height="105" rx="18" fill="#63d7e4"/>
    <text x="1137" y="332" fill="#0b1225" font-size="20">Verify</text>
    <text x="1137" y="360" fill="#0b1225" font-size="15">Pass?</text>
  </g>

  <g stroke="#f6f3eb" stroke-width="5" fill="none">
    <path d="M260 258 C300 258 310 315 355 330"/>
    <path d="M260 422 C300 422 310 360 355 345"/>
    <path d="M545 337h95M810 337h95M1075 337h20"/>
  </g>
</svg>