<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <!-- Alt text: Three columns distinguish hard requirements, preferences, and examples using different Project 42 colors. -->
  <title id="title">Requirements, preferences, and examples</title>
  <desc id="desc">Three labeled columns explain that hard requirements must be met, preferences guide choices, and examples illustrate direction without automatically becoming rules.</desc>
  <rect width="1200" height="675" fill="#0b1225"/>
  <text x="75" y="100" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="45" font-weight="700">Separate the signals</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="330" height="350" rx="20" fill="#ff8c5a"/>
    <text x="105" y="255" fill="#0b1225" font-size="31" font-weight="700">Hard requirements</text>
    <text x="105" y="315" fill="#0b1225" font-size="23">Must be satisfied.</text>
    <text x="105" y="370" fill="#0b1225" font-size="23">Use “must include”</text>
    <text x="105" y="405" fill="#0b1225" font-size="23">or “do not.”</text>

    <rect x="435" y="190" width="330" height="350" rx="20" fill="#a99df7"/>
    <text x="470" y="255" fill="#0b1225" font-size="31" font-weight="700">Preferences</text>
    <text x="470" y="315" fill="#0b1225" font-size="23">Guide flexible choices.</text>
    <text x="470" y="370" fill="#0b1225" font-size="23">Use “prefer” or</text>
    <text x="470" y="405" fill="#0b1225" font-size="23">“when possible.”</text>

    <rect x="800" y="190" width="330" height="350" rx="20" fill="#63d7e4"/>
    <text x="835" y="255" fill="#0b1225" font-size="31" font-weight="700">Examples</text>
    <text x="835" y="315" fill="#0b1225" font-size="23">Illustrate direction.</text>
    <text x="835" y="370" fill="#0b1225" font-size="23">Not automatically</text>
    <text x="835" y="405" fill="#0b1225" font-size="23">a rule.</text>
  </g>
</svg>