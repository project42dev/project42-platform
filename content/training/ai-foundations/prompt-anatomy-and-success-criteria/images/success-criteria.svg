<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <!-- Alt text: A navy background contains a target with four lime check marks around it, representing observable success criteria. -->
  <title id="title">Observable success criteria</title>
  <desc id="desc">A target labeled Success is surrounded by four checked criteria: required content, format, limits, and evidence.</desc>
  <rect width="1200" height="675" fill="#0b1225"/>
  <text x="80" y="105" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="46" font-weight="700">Define success before you generate</text>
  <text x="82" y="145" fill="#63d7e4" font-family="Arial, sans-serif" font-size="22">If a reviewer cannot check it, it is not yet observable</text>

  <circle cx="600" cy="375" r="150" fill="#a99df7"/>
  <circle cx="600" cy="375" r="105" fill="#ff8c5a"/>
  <circle cx="600" cy="375" r="58" fill="#c9f25f"/>
  <text x="600" y="383" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="24" font-weight="700">SUCCESS</text>

  <g font-family="Arial, sans-serif" font-size="25" fill="#f6f3eb">
    <text x="130" y="280">Required content</text>
    <text x="130" y="330">Required format</text>
    <text x="830" y="280">Stated limits</text>
    <text x="830" y="330">Supported by inputs</text>
  </g>
  <g stroke="#c9f25f" stroke-width="5" fill="none">
    <path d="M112 270l10 10 20-25"/>
    <path d="M112 320l10 10 20-25"/>
    <path d="M812 270l10 10 20-25"/>
    <path d="M812 320l10 10 20-25"/>
  </g>
</svg>