<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <!-- Alt text: An orange ambiguous request on the left becomes a structured reusable prompt template on the right through steps that identify inputs, add placeholders, and define checks. -->
  <title id="title">From ambiguity to a reusable template</title>
  <desc id="desc">A left-to-right process identifies missing details, identifies recurring inputs, adds placeholders, defines checks, and produces a reusable prompt template.</desc>
  <rect width="1200" height="675" fill="#0b1225"/>
  <text x="72" y="95" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="43" font-weight="700">From vague request to reusable template</text>

  <rect x="60" y="235" width="210" height="145" rx="18" fill="#ff8c5a"/>
  <text x="165" y="285" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="25" font-weight="700">“Make this useful”</text>
  <text x="165" y="325" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="20">Ambiguous request</text>

  <g fill="#c9f25f" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="345" y="275">Find</text><text x="345" y="305">recurring</text><text x="345" y="335">inputs</text>
    <text x="510" y="275">Define</text><text x="510" y="305">purpose</text><text x="510" y="335">and audience</text>
    <text x="675" y="275">Add</text><text x="675" y="305">placeholders</text>
    <text x="840" y="275">Define</text><text x="840" y="305">checkable</text><text x="840" y="335">criteria</text>
  </g>

  <rect x="955" y="205" width="190" height="205" rx="18" fill="#63d7e4"/>
  <text x="1050" y="260" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="24" font-weight="700">Reusable</text>
  <text x="1050" y="295" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="24" font-weight="700">template</text>
  <text x="1050" y="340" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="18">Same rules</text>
  <text x="1050" y="368" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="18">New inputs</text>

  <path d="M270 307h40M390 307h35M555 307h35M720 307h35M885 307h50" stroke="#f6f3eb" stroke-width="5" fill="none"/>
</svg>

