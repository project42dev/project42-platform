<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <!-- altText: A circular agent loop showing goal, observe state, choose a permitted action, update state, and check an exit condition before either repeating or stopping. -->
  <title id="title">Bounded agent loop</title>
  <desc id="desc">A loop from goal to observation, decision, permitted action, state update, and exit check. The loop repeats only when the exit condition is not met.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#63d7e4"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1225">A bounded agent loop</text>
  <text x="60" y="94" font-family="Arial, sans-serif" font-size="17" fill="#0b1225">Flexible decisions stay inside an explicit safety boundary.</text>

  <rect x="75" y="180" width="145" height="70" rx="14" fill="#a99df7"/>
  <text x="147" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Goal</text>

  <rect x="275" y="180" width="145" height="70" rx="14" fill="#63d7e4"/>
  <text x="347" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Observe state</text>

  <rect x="475" y="180" width="145" height="70" rx="14" fill="#c9f25f"/>
  <text x="547" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Choose step</text>

  <rect x="675" y="180" width="145" height="70" rx="14" fill="#ff8c5a"/>
  <text x="747" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">Permitted</text>
  <text x="747" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">action</text>

  <path d="M220 215 H270" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M420 215 H470" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M620 215 H670" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="375" y="345" width="150" height="70" rx="14" fill="#0b1225"/>
  <text x="450" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#f6f3eb">Update state</text>

  <path d="M747 250 C747 335 650 380 530 380" fill="none" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M375 380 C245 380 180 330 180 255" fill="none" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="110" y="365" font-family="Arial, sans-serif" font-size="16" fill="#0b1225">repeat only if needed</text>

  <path d="M450 345 V300" stroke="#ff8c5a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M525 380 C620 450 800 430 825 285" fill="none" stroke="#ff8c5a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="650" y="450" font-family="Arial, sans-serif" font-size="16" fill="#0b1225">exit, report, or hand off</text>
</svg>