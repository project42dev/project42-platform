<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <!-- altText: A recovery path detects looping, drift, unsafe action, or missing information, stops the risky step, preserves verified facts, and creates a complete human handoff. -->
  <title id="title">Recovery and human handoff</title>
  <desc id="desc">An agent checks whether it can continue safely. If not, it blocks the action, preserves verified facts, records the reason, and sends a structured handoff to a person.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#63d7e4"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <text x="55" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1225">When the agent cannot safely continue</text>

  <rect x="55" y="175" width="155" height="76" rx="15" fill="#c9f25f"/>
  <text x="132" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#0b1225">Agent step</text>

  <polygon points="330,145 425,213 330,281 235,213" fill="#a99df7"/>
  <text x="330" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">Continue</text>
  <text x="330" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">safely?</text>

  <rect x="505" y="105" width="175" height="64" rx="14" fill="#ff8c5a"/>
  <text x="592" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">Stop blocked step</text>

  <rect x="505" y="205" width="175" height="64" rx="14" fill="#63d7e4"/>
  <text x="592" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#0b1225">Preserve verified facts</text>

  <rect x="505" y="305" width="175" height="64" rx="14" fill="#a99df7"/>
  <text x="592" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0b1225">Record reason and</text>
  <text x="592" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#0b1225">unresolved questions</text>

  <rect x="735" y="190" width="130" height="105" rx="15" fill="#0b1225"/>
  <text x="800" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#f6f3eb">Human</text>
  <text x="800" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#f6f3eb">handoff</text>
  <text x="800" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#f6f3eb">next step</text>

  <path d="M210 213 H230" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M425 180 C460 155 475 140 500 140" fill="none" stroke="#ff8c5a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M425 213 H500" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M425 246 C460 275 475 337 500 337" fill="none" stroke="#a99df7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 237 H730" stroke="#63d7e4" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 337 C715 337 720 285 750 285" fill="none" stroke="#a99df7" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="445" y="156" font-family="Arial, sans-serif" font-size="15" fill="#0b1225">No: loop, drift, unsafe, or incomplete</text>
  <text x="440" y="200" font-family="Arial, sans-serif" font-size="15" fill="#0b1225">Yes: continue within budget</text>
</svg>

---