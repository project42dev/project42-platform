<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <!-- altText: Five clearly labeled guardrails surround an agent: input, permissions, state, output, and action. Failed checks lead to a review path. -->
  <title id="title">Layered guardrails</title>
  <desc id="desc">Five labeled control layers surround a central agent decision: input, permissions, state, output, and action. A failed check can block the path or require review.</desc>
  <rect width="900" height="560" fill="#f6f3eb"/>
  <text x="55" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1225">Guardrails at every boundary</text>
  <text x="55" y="84" font-family="Arial, sans-serif" font-size="17" fill="#0b1225">A reminder is not a control unless it can block, limit, or require review.</text>

  <rect x="55" y="125" width="790" height="55" rx="14" fill="#63d7e4"/>
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Input: accept only complete, allowed requests</text>

  <rect x="90" y="195" width="720" height="55" rx="14" fill="#a99df7"/>
  <text x="115" y="230" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Permissions: limit records and capabilities</text>

  <rect x="125" y="265" width="650" height="55" rx="14" fill="#c9f25f"/>
  <text x="150" y="300" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">State: separate facts, claims, and pending work</text>

  <rect x="160" y="335" width="580" height="55" rx="14" fill="#ff8c5a"/>
  <text x="185" y="370" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Output: label or block unverified results</text>

  <rect x="195" y="405" width="510" height="55" rx="14" fill="#a99df7"/>
  <text x="220" y="440" font-family="Arial, sans-serif" font-size="19" fill="#0b1225">Action: block or require approval</text>

  <rect x="315" y="485" width="270" height="45" rx="12" fill="#0b1225"/>
  <text x="450" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f6f3eb">Agent decision</text>
</svg>