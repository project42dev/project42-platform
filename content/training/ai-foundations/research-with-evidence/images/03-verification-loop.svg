<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <!-- Alt text: A conditional verification loop checks source access, exact support, and context before recording a locator; failed checks lead to revision, replacement, or a reported gap. -->
  <title id="title">Verify before publishing</title>
  <desc id="desc">A loop moves from opening the source to checking exact support and context. Successful verification records a locator; failed verification returns to revision or reports a gap.</desc>
  <rect width="1000" height="620" fill="#f6f3eb"/>
  <text x="55" y="58" fill="#0b1225" font-family="Arial, sans-serif" font-size="30" font-weight="700">Verify before publishing</text>
  <rect x="350" y="100" width="300" height="72" rx="18" fill="#0b1225"/>
  <text x="500" y="145" text-anchor="middle" fill="#c9f25f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Open the source</text>
  <rect x="350" y="235" width="300" height="72" rx="18" fill="#63d7e4"/>
  <text x="500" y="280" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="20" font-weight="700">Check exact support</text>
  <rect x="350" y="370" width="300" height="72" rx="18" fill="#a99df7"/>
  <text x="500" y="415" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="20" font-weight="700">Check context and limits</text>
  <rect x="350" y="505" width="300" height="72" rx="18" fill="#c9f25f"/>
  <text x="500" y="550" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="20" font-weight="700">Record locator and confidence</text>
  <g stroke="#ff8c5a" stroke-width="7" fill="none">
    <path d="M500 172 V225 M500 307 V360 M500 442 V495"/>
    <path d="M350 406 H185 Q115 406 115 330 V150 Q115 80 185 80 H325"/>
    <path d="M315 65 L335 80 L315 95"/>
  </g>
  <rect x="690" y="235" width="245" height="100" rx="16" fill="#ff8c5a"/>
  <text x="812" y="270" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="17" font-weight="700">Failed check</text>
  <text x="812" y="297" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="15">Revise, replace,</text>
  <text x="812" y="319" text-anchor="middle" fill="#0b1225" font-family="Arial, sans-serif" font-size="15">or report the gap</text>
  <path d="M650 270 H680" stroke="#ff8c5a" stroke-width="7" fill="none"/>
  <path d="M670 255 L690 270 L670 285" stroke="#ff8c5a" stroke-width="7" fill="none"/>
</svg>