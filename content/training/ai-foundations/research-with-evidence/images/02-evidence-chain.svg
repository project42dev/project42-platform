<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 420" role="img" aria-labelledby="title desc">
  <!-- Alt text: A horizontal chain connects an original source to extracted evidence, a claim, an interpretation, and a qualified recommendation. -->
  <title id="title">The evidence chain</title>
  <desc id="desc">Five connected stages show that a recommendation should trace back through interpretation, claim, and extracted evidence to an original source.</desc>
  <rect width="1250" height="420" fill="#f6f3eb"/>
  <text x="45" y="58" fill="#0b1225" font-family="Arial, sans-serif" font-size="30" font-weight="700">Keep the evidence chain visible</text>
  <line x1="135" y1="220" x2="1110" y2="220" stroke="#ff8c5a" stroke-width="8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="120" cy="220" r="78" fill="#0b1225"/>
    <text x="120" y="212" fill="#c9f25f" font-size="20" font-weight="700">Original</text>
    <text x="120" y="238" fill="#f6f3eb" font-size="18">source</text>
    <circle cx="365" cy="220" r="78" fill="#63d7e4"/>
    <text x="365" y="212" fill="#0b1225" font-size="19" font-weight="700">Extracted</text>
    <text x="365" y="238" fill="#0b1225" font-size="17">evidence</text>
    <circle cx="610" cy="220" r="78" fill="#a99df7"/>
    <text x="610" y="212" fill="#0b1225" font-size="20" font-weight="700">Claim</text>
    <text x="610" y="238" fill="#0b1225" font-size="17">with locator</text>
    <circle cx="855" cy="220" r="78" fill="#ff8c5a"/>
    <text x="855" y="212" fill="#0b1225" font-size="19" font-weight="700">Interpretation</text>
    <text x="855" y="238" fill="#0b1225" font-size="16">what it means</text>
    <circle cx="1100" cy="220" r="78" fill="#c9f25f"/>
    <text x="1100" y="212" fill="#0b1225" font-size="18" font-weight="700">Qualified</text>
    <text x="1100" y="238" fill="#0b1225" font-size="16">recommendation</text>
  </g>
  <g stroke="#ff8c5a" stroke-width="8" fill="none">
    <path d="M218 205 L238 220 L218 235 M463 205 L483 220 L463 235 M708 205 L728 220 L708 235 M953 205 L973 220 L953 235"/>
  </g>
</svg>