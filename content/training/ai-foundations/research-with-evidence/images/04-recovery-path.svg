<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 570" role="img" aria-labelledby="title desc">
  <!-- Alt text: A blocked or weak search branches into different recovery actions, then returns to an evidence register or records a missing-evidence gap. -->
  <title id="title">Recover from a weak search</title>
  <desc id="desc">A central weak-search card points to narrower queries, better source terms, exact-title searches, and checking original passages before the result is recorded.</desc>
  <rect width="1050" height="570" fill="#f6f3eb"/>
  <text x="55" y="58" fill="#0b1225" font-family="Arial, sans-serif" font-size="30" font-weight="700">Recovery is part of research</text>
  <rect x="370" y="100" width="310" height="78" rx="18" fill="#0b1225"/>
  <text x="525" y="132" text-anchor="middle" fill="#c9f25f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Weak or blocked</text>
  <text x="525" y="158" text-anchor="middle" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="18">search result</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="55" y="255" width="220" height="105" rx="16" fill="#63d7e4"/>
    <text x="165" y="293" fill="#0b1225">Add outcome,</text>
    <text x="165" y="320" fill="#0b1225">place, or date</text>
    <rect x="300" y="255" width="220" height="105" rx="16" fill="#a99df7"/>
    <text x="410" y="293" fill="#0b1225">Add report,</text>
    <text x="410" y="320" fill="#0b1225">evaluation, or policy</text>
    <rect x="545" y="255" width="220" height="105" rx="16" fill="#c9f25f"/>
    <text x="655" y="293" fill="#0b1225">Search exact title</text>
    <text x="655" y="320" fill="#0b1225">or public copy</text>
    <rect x="790" y="255" width="220" height="105" rx="16" fill="#ff8c5a"/>
    <text x="900" y="293" fill="#0b1225">Return to original</text>
    <text x="900" y="320" fill="#0b1225">passages</text>
  </g>
  <g stroke="#ff8c5a" stroke-width="7" fill="none">
    <path d="M525 178 V220 M525 220 H165 V245 M525 220 H410 V245 M525 220 H655 V245 M525 220 H900 V245"/>
    <path d="M165 360 V430 H420 V455 M410 360 V430 H420 M655 360 V430 H420 M900 360 V430 H420"/>
    <path d="M400 440 L420 455 L400 470"/>
  </g>
  <rect x="330" y="455" width="380" height="72" rx="18" fill="#0b1225"/>
  <text x="520" y="500" text-anchor="middle" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Update register or mark evidence gap</text>
</svg>

