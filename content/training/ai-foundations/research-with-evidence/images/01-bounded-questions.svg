<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <!-- Alt text: A broad research need narrows into three bounded questions, each with a visible scope. -->
  <title id="title">From broad need to bounded questions</title>
  <desc id="desc">A large navy question card points to three smaller cards for cost, staffing, and accessibility, showing how a broad question becomes manageable.</desc>
  <rect width="1000" height="560" fill="#f6f3eb"/>
  <text x="60" y="65" fill="#0b1225" font-family="Arial, sans-serif" font-size="30" font-weight="700">Bound the question before searching</text>
  <rect x="65" y="150" width="285" height="190" rx="20" fill="#0b1225"/>
  <text x="95" y="205" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Broad need</text>
  <text x="95" y="250" fill="#c9f25f" font-family="Arial, sans-serif" font-size="25">Should we add</text>
  <text x="95" y="285" fill="#c9f25f" font-family="Arial, sans-serif" font-size="25">self-checkout?</text>
  <path d="M350 245 H420" stroke="#ff8c5a" stroke-width="8" fill="none"/>
  <path d="M410 230 L430 245 L410 260" stroke="#ff8c5a" stroke-width="8" fill="none"/>
  <rect x="465" y="105" width="450" height="90" rx="16" fill="#63d7e4"/>
  <text x="495" y="145" fill="#0b1225" font-family="Arial, sans-serif" font-size="21" font-weight="700">Cost</text>
  <text x="495" y="174" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">What costs did comparable libraries report?</text>
  <rect x="465" y="235" width="450" height="90" rx="16" fill="#a99df7"/>
  <text x="495" y="275" fill="#0b1225" font-family="Arial, sans-serif" font-size="21" font-weight="700">Staffing</text>
  <text x="495" y="304" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">How did duties or workload change?</text>
  <rect x="465" y="365" width="450" height="90" rx="16" fill="#c9f25f"/>
  <text x="495" y="405" fill="#0b1225" font-family="Arial, sans-serif" font-size="21" font-weight="700">Accessibility</text>
  <text x="495" y="434" fill="#0b1225" font-family="Arial, sans-serif" font-size="17">What requirements apply in this region?</text>
</svg>