<!-- Alt text: A central multimodal input branches to text, image, and audio cards. The inputs pass through clarity and accessibility checks before reaching human review. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Multimodal input quality checks</title>
  <desc id="desc">Text, image, and audio inputs are checked for clarity and accessibility before human review.</desc>
  <rect width="900" height="560" fill="#f6f3eb"/>
  <circle cx="450" cy="270" r="92" fill="#0b1225"/>
  <text x="389" y="260" fill="#c9f25f" font-family="Arial" font-size="25" font-weight="700">INPUT</text>
  <text x="370" y="294" fill="#f6f3eb" font-family="Arial" font-size="19">multimodal</text>
  <g font-family="Arial" font-size="23" font-weight="700">
    <rect x="70" y="80" width="205" height="100" rx="16" fill="#63d7e4"/>
    <text x="137" y="140" fill="#0b1225">Text</text>
    <rect x="348" y="55" width="205" height="100" rx="16" fill="#c9f25f"/>
    <text x="413" y="115" fill="#0b1225">Image</text>
    <rect x="625" y="80" width="205" height="100" rx="16" fill="#a99df7"/>
    <text x="682" y="140" fill="#0b1225">Audio</text>
  </g>
  <path d="M275 140 L380 235 M450 155 V178 M625 140 L520 235" fill="none" stroke="#0b1225" stroke-width="5"/>
  <rect x="265" y="390" width="370" height="85" rx="18" fill="#ff8c5a"/>
  <text x="315" y="427" fill="#0b1225" font-family="Arial" font-size="22" font-weight="700">Clarity + accessibility</text>
  <text x="345" y="455" fill="#0b1225" font-family="Arial" font-size="18">transcript, description, quality</text>
  <path d="M450 362 V390" fill="none" stroke="#0b1225" stroke-width="5"/>
  <rect x="315" y="500" width="270" height="45" rx="12" fill="#0b1225"/>
  <text x="352" y="530" fill="#f6f3eb" font-family="Arial" font-size="20" font-weight="700">Human review</text>
</svg>