<!-- Alt text: A conversation flows into an external record that contains specific source labels, confirmed decisions, and open questions. A compact handoff flows into a new conversation and is checked against the record. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Persisting important information</title>
  <desc id="desc">Important decisions and their specific sources are saved outside a conversation and used as a handoff for a new conversation.</desc>
  <rect width="900" height="560" fill="#f6f3eb"/>
  <rect x="45" y="105" width="220" height="130" rx="18" fill="#63d7e4"/>
  <text x="95" y="160" fill="#0b1225" font-family="Arial" font-size="27" font-weight="700">Conversation</text>
  <text x="85" y="195" fill="#0b1225" font-family="Arial" font-size="19">ideas and decisions</text>
  <path d="M265 170 H335 M315 155 L335 170 L315 185" fill="none" stroke="#0b1225" stroke-width="5"/>
  <rect x="335" y="55" width="330" height="260" rx="18" fill="#0b1225"/>
  <text x="385" y="105" fill="#c9f25f" font-family="Arial" font-size="27" font-weight="700">External record</text>
  <text x="380" y="150" fill="#f6f3eb" font-family="Arial" font-size="19">Source: approved announcement</text>
  <text x="380" y="182" fill="#f6f3eb" font-family="Arial" font-size="19">Decision: use date from source</text>
  <text x="380" y="214" fill="#f6f3eb" font-family="Arial" font-size="19">Confidence: high</text>
  <text x="380" y="246" fill="#f6f3eb" font-family="Arial" font-size="19">Open question: arrival time</text>
  <path d="M665 170 H735 M715 155 L735 170 L715 185" fill="none" stroke="#0b1225" stroke-width="5"/>
  <rect x="735" y="105" width="120" height="130" rx="18" fill="#c9f25f"/>
  <text x="760" y="155" fill="#0b1225" font-family="Arial" font-size="22" font-weight="700">Handoff</text>
  <text x="752" y="188" fill="#0b1225" font-family="Arial" font-size="17">compact facts</text>
  <path d="M450 315 V365 M435 350 L450 365 L465 350" fill="none" stroke="#0b1225" stroke-width="5"/>
  <rect x="270" y="365" width="360" height="100" rx="18" fill="#a99df7"/>
  <text x="330" y="410" fill="#0b1225" font-family="Arial" font-size="24" font-weight="700">New conversation</text>
  <text x="320" y="440" fill="#0b1225" font-family="Arial" font-size="18">continue with selected context</text>
  <path d="M630 415 H700 M680 400 L700 415 L680 430" fill="none" stroke="#0b1225" stroke-width="5"/>
  <rect x="700" y="385" width="155" height="60" rx="14" fill="#ff8c5a"/>
  <text x="730" y="422" fill="#0b1225" font-family="Arial" font-size="19" font-weight="700">Check record</text>
</svg>

