<!-- Alt text: A limited context window contains the task and relevant facts. Unrelated material and repeated history are outside the selected context, and the selected context leads to a focused answer. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">A focused context window</title>
  <desc id="desc">Relevant task information fits inside a limited context window, while unrelated and repeated material is left outside.</desc>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <rect x="45" y="55" width="810" height="350" rx="24" fill="#0b1225"/>
  <text x="80" y="105" fill="#f6f3eb" font-family="Arial" font-size="28" font-weight="700">SELECTED CONTEXT</text>
  <rect x="90" y="145" width="315" height="90" rx="14" fill="#c9f25f"/>
  <text x="125" y="185" fill="#0b1225" font-family="Arial" font-size="25" font-weight="700">Task</text>
  <text x="125" y="215" fill="#0b1225" font-family="Arial" font-size="20">What must be done</text>
  <rect x="90" y="260" width="315" height="90" rx="14" fill="#63d7e4"/>
  <text x="125" y="300" fill="#0b1225" font-family="Arial" font-size="25" font-weight="700">Relevant facts</text>
  <text x="125" y="330" fill="#0b1225" font-family="Arial" font-size="20">Evidence for the answer</text>
  <rect x="475" y="145" width="315" height="90" rx="14" fill="#ff8c5a"/>
  <text x="510" y="185" fill="#0b1225" font-family="Arial" font-size="25" font-weight="700">Unrelated material</text>
  <text x="510" y="215" fill="#0b1225" font-family="Arial" font-size="20">Adds noise</text>
  <rect x="475" y="260" width="315" height="90" rx="14" fill="#a99df7"/>
  <text x="510" y="300" fill="#0b1225" font-family="Arial" font-size="25" font-weight="700">Repeated history</text>
  <text x="510" y="330" fill="#0b1225" font-family="Arial" font-size="20">Consumes space</text>
  <path d="M405 200 H455 M440 185 L455 200 L440 215" fill="none" stroke="#f6f3eb" stroke-width="5"/>
  <text x="245" y="455" fill="#0b1225" font-family="Arial" font-size="26" font-weight="700">Select for focus, not volume</text>
</svg>