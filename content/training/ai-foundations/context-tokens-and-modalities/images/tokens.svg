<!-- Alt text: A phrase is shown as several token pieces, including the subword pieces “un”, “break”, and “able”, plus punctuation. The pieces sit inside a limited context space. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Text becomes token pieces</title>
  <desc id="desc">A phrase is divided into pieces that may be whole words, parts of words, or punctuation inside a limited context space.</desc>
  <rect width="900" height="500" fill="#f6f3eb"/>
  <text x="70" y="80" fill="#0b1225" font-family="Arial" font-size="32" font-weight="700">Text enters as smaller pieces</text>
  <rect x="70" y="125" width="760" height="260" rx="24" fill="#0b1225"/>
  <text x="105" y="175" fill="#f6f3eb" font-family="Arial" font-size="24">Context space</text>
  <g font-family="Arial" font-size="23" font-weight="700">
    <rect x="105" y="220" width="115" height="70" rx="10" fill="#c9f25f"/>
    <text x="142" y="264" fill="#0b1225">The</text>
    <rect x="230" y="220" width="90" height="70" rx="10" fill="#63d7e4"/>
    <text x="258" y="264" fill="#0b1225">un</text>
    <rect x="330" y="220" width="125" height="70" rx="10" fill="#a99df7"/>
    <text x="357" y="264" fill="#0b1225">break</text>
    <rect x="465" y="220" width="105" height="70" rx="10" fill="#ff8c5a"/>
    <text x="490" y="264" fill="#0b1225">able</text>
    <rect x="580" y="220" width="105" height="70" rx="10" fill="#c9f25f"/>
    <text x="612" y="264" fill="#0b1225">text</text>
    <rect x="695" y="220" width="70" height="70" rx="10" fill="#63d7e4"/>
    <text x="718" y="264" fill="#0b1225">!</text>
  </g>
  <text x="105" y="345" fill="#f6f3eb" font-family="Arial" font-size="21">A token may be a word, part of a word, or punctuation.</text>
  <path d="M450 405 V435 M435 420 L450 435 L465 420" fill="none" stroke="#0b1225" stroke-width="5"/>
  <text x="275" y="475" fill="#0b1225" font-family="Arial" font-size="24" font-weight="700">More text uses more context space</text>
</svg>