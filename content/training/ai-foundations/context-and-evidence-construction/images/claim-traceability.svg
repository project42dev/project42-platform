<!-- Alt text: A proposed claim is linked to a precise source passage, checked for direct support and source quality, and then either included, qualified because of conflict, or revised as unsupported. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Claim to evidence traceability</title>
  <desc id="desc">A claim is linked to a source passage, checked for direct support and source quality, and routed to an included, qualified, or revised result.</desc>
  <rect width="1200" height="520" fill="#0b1225"/>
  <text x="55" y="65" fill="#f6f3eb" font-family="Arial,sans-serif" font-size="29" font-weight="700">Every important claim needs a trail</text>
  <g font-family="Arial,sans-serif" font-size="19" text-anchor="middle">
    <rect x="40" y="170" width="190" height="90" rx="18" fill="#a99df7"/>
    <text x="135" y="210" fill="#0b1225"><tspan x="135">Proposed</tspan><tspan x="135" dy="27">claim</tspan></text>
    <path d="M230 215h55M265 200l20 15-20 15" stroke="#63d7e4" stroke-width="5" fill="none"/>
    <rect x="295" y="170" width="220" height="90" rx="18" fill="#c9f25f"/>
    <text x="405" y="210" fill="#0b1225"><tspan x="405">Source passage</tspan><tspan x="405" dy="27">and location</tspan></text>
    <path d="M515 215h55M550 200l20 15-20 15" stroke="#63d7e4" stroke-width="5" fill="none"/>
    <rect x="605" y="170" width="250" height="90" rx="18" fill="#63d7e4"/>
    <text x="730" y="210" fill="#0b1225"><tspan x="730">Direct support and</tspan><tspan x="730" dy="27">source-quality check</tspan></text>
    <path d="M730 260v55M715 295l15 20 15-20" stroke="#63d7e4" stroke-width="5" fill="none"/>
    <rect x="570" y="345" width="200" height="80" rx="18" fill="#c9f25f"/>
    <text x="670" y="378" fill="#0b1225"><tspan x="670">Supported</tspan><tspan x="670" dy="25">claim</tspan></text>
    <path d="M605 215H470V430H370" stroke="#ff8c5a" stroke-width="4" fill="none"/>
    <rect x="160" y="390" width="210" height="80" rx="18" fill="#ff8c5a"/>
    <text x="265" y="423" fill="#0b1225"><tspan x="265">Unsupported:</tspan><tspan x="265" dy="25">revise or remove</tspan></text>
    <path d="M855 215h80M915 200l20 15-20 15" stroke="#63d7e4" stroke-width="5" fill="none"/>
    <rect x="955" y="170" width="200" height="90" rx="18" fill="#a99df7"/>
    <text x="1055" y="210" fill="#0b1225"><tspan x="1055">Conflict</tspan><tspan x="1055" dy="27">present?</tspan></text>
    <path d="M1055 260v55M1040 295l15 20 15-20" stroke="#63d7e4" stroke-width="5" fill="none"/>
    <rect x="955" y="345" width="200" height="80" rx="18" fill="#f6f3eb"/>
    <text x="1055" y="378" fill="#0b1225"><tspan x="1055">Qualify claim</tspan><tspan x="1055" dy="25">and record conflict</tspan></text>
  </g>
</svg>

