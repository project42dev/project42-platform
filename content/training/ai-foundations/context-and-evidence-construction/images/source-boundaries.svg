<!-- Alt text: Three separated panels identify evidence, instructions, and untrusted content inside a controlled working set, showing that source text does not automatically control the task. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Source boundaries</title>
  <desc id="desc">Evidence, instructions, and untrusted content are labeled separately inside a controlled working set.</desc>
  <rect width="1000" height="520" fill="#0b1225"/>
  <text x="55" y="65" fill="#f6f3eb" font-family="Arial,sans-serif" font-size="30" font-weight="700">Label the content before using it</text>
  <rect x="45" y="105" width="910" height="350" rx="24" fill="none" stroke="#63d7e4" stroke-width="4"/>
  <text x="75" y="145" fill="#63d7e4" font-family="Arial,sans-serif" font-size="18">CONTROLLED WORKING SET</text>
  <g font-family="Arial,sans-serif">
    <rect x="80" y="185" width="240" height="190" rx="18" fill="#c9f25f"/>
    <text x="200" y="235" text-anchor="middle" fill="#0b1225" font-size="25" font-weight="700">EVIDENCE</text>
    <text x="105" y="280" fill="#0b1225" font-size="18">Facts to evaluate</text>
    <text x="105" y="315" fill="#0b1225" font-size="18">with source identity</text>
    <text x="105" y="350" fill="#0b1225" font-size="18">and location</text>
    <rect x="380" y="185" width="240" height="190" rx="18" fill="#a99df7"/>
    <text x="500" y="235" text-anchor="middle" fill="#0b1225" font-size="25" font-weight="700">INSTRUCTIONS</text>
    <text x="405" y="280" fill="#0b1225" font-size="18">Task requirements</text>
    <text x="405" y="315" fill="#0b1225" font-size="18">kept separate from</text>
    <text x="405" y="350" fill="#0b1225" font-size="18">source claims</text>
    <rect x="680" y="185" width="240" height="190" rx="18" fill="#ff8c5a"/>
    <text x="800" y="235" text-anchor="middle" fill="#0b1225" font-size="25" font-weight="700">UNTRUSTED</text>
    <text x="705" y="280" fill="#0b1225" font-size="18">May contain errors</text>
    <text x="705" y="315" fill="#0b1225" font-size="18">or redirecting text</text>
    <text x="705" y="350" fill="#0b1225" font-size="18">Do not grant control</text>
  </g>
</svg>