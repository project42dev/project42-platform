<!-- Alt text: A left-to-right flow shows a task question narrowing candidate sources through relevance, permission, usability, and source-quality checks into a selected working set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Context selection</title>
  <desc id="desc">A task question is filtered through relevance, permission, usability, and source-quality checks before becoming a working set.</desc>
  <rect width="1200" height="420" fill="#0b1225"/>
  <text x="70" y="70" fill="#f6f3eb" font-family="Arial,sans-serif" font-size="28" font-weight="700">Build the right context</text>
  <g font-family="Arial,sans-serif" font-size="20" text-anchor="middle">
    <rect x="55" y="160" width="180" height="100" rx="18" fill="#a99df7"/>
    <text x="145" y="205" fill="#0b1225"><tspan x="145">Task</tspan><tspan x="145" dy="28">question</tspan></text>
    <path d="M235 210h70M290 195l20 15-20 15" stroke="#63d7e4" stroke-width="6" fill="none"/>
    <rect x="315" y="160" width="180" height="100" rx="18" fill="#63d7e4"/>
    <text x="405" y="205" fill="#0b1225"><tspan x="405">Relevant?</tspan><tspan x="405" dy="28">Keep scope</tspan></text>
    <path d="M495 210h70M550 195l20 15-20 15" stroke="#63d7e4" stroke-width="6" fill="none"/>
    <rect x="575" y="160" width="180" height="100" rx="18" fill="#c9f25f"/>
    <text x="665" y="205" fill="#0b1225"><tspan x="665">Permitted?</tspan><tspan x="665" dy="28">Use responsibly</tspan></text>
    <path d="M755 210h70M810 195l20 15-20 15" stroke="#63d7e4" stroke-width="6" fill="none"/>
    <rect x="835" y="160" width="180" height="100" rx="18" fill="#ff8c5a"/>
    <text x="925" y="205" fill="#0b1225"><tspan x="925">Usable?</tspan><tspan x="925" dy="28">Check source</tspan></text>
    <path d="M1015 210h70M1070 195l20 15-20 15" stroke="#63d7e4" stroke-width="6" fill="none"/>
    <rect x="1095" y="160" width="90" height="100" rx="18" fill="#f6f3eb"/>
    <text x="1140" y="205" fill="#0b1225"><tspan x="1140">Working</tspan><tspan x="1140" dy="28">set</tspan></text>
  </g>
</svg>