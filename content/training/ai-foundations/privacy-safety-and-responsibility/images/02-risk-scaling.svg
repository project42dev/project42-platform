<!-- Alt text: Three separate risk-factor panels show that consequence, exposure, and reversibility are assessed independently before safeguards are chosen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Assess risk factors independently</title>
  <desc id="desc">Consequence, exposure, and reversibility are separate factors. Their combined assessment determines whether review and safeguards should be light or strong.</desc>
  <rect width="1000" height="560" fill="#0b1225"/>
  <text x="60" y="60" fill="#f6f3eb" font-family="Arial" font-size="30" font-weight="700">ASSESS THREE RISK FACTORS</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="55" y="120" width="270" height="210" rx="18" fill="#ff8c5a"/>
    <text x="190" y="165" fill="#0b1225" font-size="23" font-weight="700">CONSEQUENCE</text>
    <text x="190" y="215" fill="#0b1225" font-size="18">What could happen</text>
    <text x="190" y="245" fill="#0b1225" font-size="18">if the output is wrong?</text>
    <text x="190" y="290" fill="#0b1225" font-size="18" font-weight="700">low ← → high</text>
    <rect x="365" y="120" width="270" height="210" rx="18" fill="#63d7e4"/>
    <text x="500" y="165" fill="#0b1225" font-size="23" font-weight="700">EXPOSURE</text>
    <text x="500" y="215" fill="#0b1225" font-size="18">Who could see or</text>
    <text x="500" y="245" fill="#0b1225" font-size="18">act on the output?</text>
    <text x="500" y="290" fill="#0b1225" font-size="18" font-weight="700">narrow ← → wide</text>
    <rect x="675" y="120" width="270" height="210" rx="18" fill="#a99df7"/>
    <text x="810" y="165" fill="#0b1225" font-size="23" font-weight="700">REVERSIBILITY</text>
    <text x="810" y="215" fill="#0b1225" font-size="18">How hard is the</text>
    <text x="810" y="245" fill="#0b1225" font-size="18">result to undo?</text>
    <text x="810" y="290" fill="#0b1225" font-size="18" font-weight="700">easy ← → hard</text>
  </g>
  <path d="M500 350 V405" stroke="#c9f25f" stroke-width="8"/>
  <path d="M480 385 L500 415 L520 385" fill="none" stroke="#c9f25f" stroke-width="8"/>
  <rect x="250" y="425" width="500" height="75" rx="16" fill="#c9f25f"/>
  <text x="500" y="458" fill="#0b1225" font-family="Arial" font-size="21" font-weight="700" text-anchor="middle">Choose proportionate safeguards</text>
  <text x="500" y="485" fill="#0b1225" font-family="Arial" font-size="16" text-anchor="middle">spot-check • expert review • approval • monitoring</text>
</svg>