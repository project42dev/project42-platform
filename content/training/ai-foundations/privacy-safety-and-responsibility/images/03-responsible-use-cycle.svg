<!-- Alt text: Arrows form a continuous responsible-use cycle from purpose and input boundary through risk assessment, verification, release, monitoring, and recovery. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Responsible-use cycle</title>
  <desc id="desc">Responsible use repeats through purpose, input boundary, risk assessment, output verification, human release, monitoring, and recovery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c9f25f"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#0b1225"/>
  <text x="60" y="60" fill="#f6f3eb" font-family="Arial" font-size="30" font-weight="700">RESPONSIBLE USE IS A CYCLE</text>
  <g font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="350" y="105" width="200" height="58" rx="14" fill="#63d7e4"/><text x="450" y="141" fill="#0b1225">Purpose + owner</text>
    <rect x="610" y="205" width="200" height="58" rx="14" fill="#c9f25f"/><text x="710" y="241" fill="#0b1225">Input boundary</text>
    <rect x="610" y="365" width="200" height="70" rx="14" fill="#ff8c5a"/><text x="710" y="394" fill="#0b1225">Risk assessment</text><text x="710" y="418" fill="#0b1225" font-size="14">consequence • exposure • reversibility</text>
    <rect x="350" y="485" width="200" height="58" rx="14" fill="#a99df7"/><text x="450" y="521" fill="#0b1225">Verify output</text>
    <rect x="90" y="365" width="200" height="70" rx="14" fill="#63d7e4"/><text x="190" y="394" fill="#0b1225">Release with</text><text x="190" y="418" fill="#0b1225">human accountability</text>
    <rect x="90" y="205" width="200" height="58" rx="14" fill="#c9f25f"/><text x="190" y="241" fill="#0b1225">Monitor outcomes</text>
  </g>
  <g fill="none" stroke="#c9f25f" stroke-width="7" marker-end="url(#arrow)">
    <path d="M550 145 L650 205"/>
    <path d="M710 263 L710 365"/>
    <path d="M610 420 L550 485"/>
    <path d="M350 520 L290 420"/>
    <path d="M190 365 L190 263"/>
    <path d="M290 205 L350 145"/>
    <path d="M90 235 C25 270 25 390 90 400"/>
  </g>
  <text x="450" y="585" fill="#f6f3eb" font-family="Arial" font-size="16" text-anchor="middle">If a problem appears: pause, correct, notify, document, and reassess.</text>
</svg>