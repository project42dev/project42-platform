<!-- Alt text: A navy panel shows a funnel separating private and unnecessary information from the minimum safe input. Only necessary, generalized information passes into the task. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Set an input boundary</title>
  <desc id="desc">A funnel filters information so only necessary, safe data enters an AI task.</desc>
  <rect width="1000" height="560" rx="28" fill="#0b1225"/>
  <text x="70" y="76" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Set the input boundary</text>
  <text x="70" y="116" fill="#63d7e4" font-family="Arial, sans-serif" font-size="20">Use the minimum information needed for the purpose.</text>
  <rect x="70" y="190" width="220" height="70" rx="16" fill="#ff8c5a"/>
  <text x="180" y="232" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Private details</text>
  <rect x="70" y="305" width="220" height="70" rx="16" fill="#a99df7"/>
  <text x="180" y="347" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Unneeded data</text>
  <path d="M335 160 L620 160 L535 400 L420 400 Z" fill="#f6f3eb"/>
  <path d="M300 225 H395" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M300 340 H395" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="478" y="285" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Minimize</text>
  <text x="478" y="318" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">remove • generalize</text>
  <path d="M535 400 H735" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="760" y="250" width="170" height="90" rx="18" fill="#c9f25f"/>
  <text x="845" y="290" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700">Safe input</text>
  <text x="845" y="320" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">for the task</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c9f25f"/>
    </marker>
  </defs>
</svg>