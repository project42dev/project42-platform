<!-- Alt text: An AI-assisted draft is checked by a human, then either released or sent to a human decision to revise manually or discard. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Human verification before release</title>
  <desc id="desc">An AI-assisted draft goes to a human reviewer. A passed check leads to human-approved release; a failed check leads to manual revision or stopping, not automatic publication.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c9f25f"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#0b1225"/>
  <text x="60" y="60" fill="#f6f3eb" font-family="Arial" font-size="30" font-weight="700">VERIFY BEFORE RELEASE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="55" y="180" width="190" height="100" rx="16" fill="#a99df7"/>
    <text x="150" y="225" fill="#0b1225" font-size="22" font-weight="700">AI-assisted draft</text>
    <text x="150" y="253" fill="#0b1225" font-size="16">fast, unverified</text>
    <rect x="330" y="150" width="220" height="160" rx="16" fill="#63d7e4"/>
    <text x="440" y="205" fill="#0b1225" font-size="22" font-weight="700">Human review</text>
    <text x="440" y="240" fill="#0b1225" font-size="16">facts • privacy</text>
    <text x="440" y="265" fill="#0b1225" font-size="16">fairness • policy</text>
    <rect x="650" y="125" width="190" height="95" rx="16" fill="#c9f25f"/>
    <text x="745" y="165" fill="#0b1225" font-size="21" font-weight="700">Human-approved</text>
    <text x="745" y="192" fill="#0b1225" font-size="16">release</text>
    <rect x="300" y="375" width="280" height="75" rx="16" fill="#ff8c5a"/>
    <text x="440" y="407" fill="#0b1225" font-size="20" font-weight="700">Revise manually</text>
    <text x="440" y="431" fill="#0b1225" font-size="16">or discard and stop</text>
  </g>
  <g fill="none" stroke="#c9f25f" stroke-width="7" marker-end="url(#arrow)">
    <path d="M245 230 H320"/>
    <path d="M550 190 H640"/>
    <path d="M440 310 V365"/>
  </g>
  <text x="595" y="178" fill="#f6f3eb" font-family="Arial" font-size="16">checks pass</text>
  <text x="465" y="350" fill="#f6f3eb" font-family="Arial" font-size="16">checks fail</text>
</svg>

---