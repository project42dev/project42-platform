<!-- Alt text: A circular responsible-use plan connects purpose, ownership, verification, monitoring, and recovery in a continuous loop around accountable AI use. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Responsible-use plan</title>
  <desc id="desc">Five connected steps form a cycle for accountable AI use.</desc>
  <rect width="1000" height="620" rx="28" fill="#0b1225"/>
  <text x="70" y="76" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">A responsible-use plan</text>
  <text x="70" y="116" fill="#63d7e4" font-family="Arial, sans-serif" font-size="20">Accountability continues after the output is created.</text>

  <circle cx="500" cy="340" r="108" fill="#f6f3eb"/>
  <text x="500" y="332" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Responsible</text>
  <text x="500" y="365" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">use</text>

  <path d="M500 228 C500 205 500 202 500 190" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M558 270 C610 240 640 230 675 235" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M700 325 C720 380 710 420 680 450" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M590 505 C535 535 465 535 410 505" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M320 450 C285 405 280 350 300 305" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M335 270 C375 240 405 230 442 235" stroke="#c9f25f" stroke-width="8" marker-end="url(#arrow)"/>

  <circle cx="500" cy="165" r="58" fill="#c9f25f"/>
  <text x="500" y="173" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Purpose</text>

  <circle cx="735" cy="270" r="58" fill="#63d7e4"/>
  <text x="735" y="278" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Owner</text>

  <circle cx="650" cy="500" r="58" fill="#a99df7"/>
  <text x="650" y="508" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Verify</text>

  <circle cx="350" cy="500" r="58" fill="#ff8c5a"/>
  <text x="350" y="508" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Monitor</text>

  <circle cx="265" cy="270" r="58" fill="#c9f25f"/>
  <text x="265" y="278" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Recover</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c9f25f"/>
    </marker>
  </defs>
</svg>

