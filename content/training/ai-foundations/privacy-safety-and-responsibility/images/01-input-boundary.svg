<!-- Alt text: A funnel separates sensitive information from minimized, safe task input before it reaches an AI system. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Set an input boundary</title>
  <desc id="desc">Sensitive information is screened and minimized before safe task input reaches an AI system.</desc>
  <rect width="900" height="500" fill="#0b1225"/>
  <text x="70" y="70" fill="#f6f3eb" font-family="Arial" font-size="30" font-weight="700">SET THE INPUT BOUNDARY</text>
  <rect x="70" y="140" width="220" height="230" rx="18" fill="#ff8c5a"/>
  <text x="105" y="190" fill="#0b1225" font-family="Arial" font-size="24" font-weight="700">Available</text>
  <text x="100" y="235" fill="#0b1225" font-family="Arial" font-size="19">names</text>
  <text x="100" y="270" fill="#0b1225" font-family="Arial" font-size="19">phone numbers</text>
  <text x="100" y="305" fill="#0b1225" font-family="Arial" font-size="19">private notes</text>
  <path d="M320 170 L500 250 L320 330 Z" fill="#c9f25f"/>
  <text x="350" y="395" fill="#f6f3eb" font-family="Arial" font-size="18">remove • generalize • minimize</text>
  <rect x="570" y="140" width="250" height="230" rx="18" fill="#63d7e4"/>
  <text x="610" y="190" fill="#0b1225" font-family="Arial" font-size="24" font-weight="700">Allowed input</text>
  <text x="610" y="240" fill="#0b1225" font-family="Arial" font-size="19">general topic</text>
  <text x="610" y="275" fill="#0b1225" font-family="Arial" font-size="19">needed facts</text>
  <text x="610" y="310" fill="#0b1225" font-family="Arial" font-size="19">fictional example</text>
</svg>