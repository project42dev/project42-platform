<!-- Alt text: Three separate scales show consequence, exposure, and reversibility. Each factor can be low or high, and higher values add safeguards such as minimization, review, approval, monitoring, and recovery. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Scale safeguards to risk factors</title>
  <desc id="desc">Independent consequence, exposure, and reversibility factors guide a cumulative set of safeguards.</desc>
  <rect width="1000" height="620" rx="28" fill="#0b1225"/>
  <text x="60" y="68" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Scale safeguards to risk</text>
  <text x="60" y="106" fill="#63d7e4" font-family="Arial, sans-serif" font-size="20">Assess each factor; add safeguards as any factor rises.</text>

  <text x="70" y="176" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Consequence</text>
  <line x1="290" y1="168" x2="810" y2="168" stroke="#f6f3eb" stroke-width="8"/>
  <circle cx="330" cy="168" r="18" fill="#63d7e4"/>
  <circle cx="770" cy="168" r="18" fill="#ff8c5a"/>
  <text x="290" y="210" fill="#63d7e4" font-family="Arial, sans-serif" font-size="18">lower effect if wrong</text>
  <text x="610" y="210" fill="#ff8c5a" font-family="Arial, sans-serif" font-size="18">serious effect if wrong</text>

  <text x="70" y="278" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Exposure</text>
  <line x1="290" y1="270" x2="810" y2="270" stroke="#f6f3eb" stroke-width="8"/>
  <circle cx="330" cy="270" r="18" fill="#63d7e4"/>
  <circle cx="770" cy="270" r="18" fill="#ff8c5a"/>
  <text x="290" y="312" fill="#63d7e4" font-family="Arial, sans-serif" font-size="18">limited audience</text>
  <text x="650" y="312" fill="#ff8c5a" font-family="Arial, sans-serif" font-size="18">broad or public audience</text>

  <text x="70" y="380" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="22" font-weight="700">Reversibility</text>
  <line x1="290" y1="372" x2="810" y2="372" stroke="#f6f3eb" stroke-width="8"/>
  <circle cx="330" cy="372" r="18" fill="#63d7e4"/>
  <circle cx="770" cy="372" r="18" fill="#ff8c5a"/>
  <text x="290" y="414" fill="#63d7e4" font-family="Arial, sans-serif" font-size="18">easy to correct</text>
  <text x="610" y="414" fill="#ff8c5a" font-family="Arial, sans-serif" font-size="18">difficult to undo</text>

  <rect x="70" y="465" width="840" height="90" rx="18" fill="#a99df7"/>
  <text x="490" y="500" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Higher factor → cumulative safeguards</text>
  <text x="490" y="533" fill="#0b1225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">minimize • restrict • review • approve • monitor • recover</text>
</svg>