<!-- Alt text: A proposed action passes through a distinct approval checkpoint and execution box before reaching a separate, equally prominent independent verification check. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
  <title id="title">Approval, execution, and independent verification</title>
  <desc id="desc">A proposal pauses for specific approval, executes once, and then passes through a separate independent verification stage.</desc>
  <rect width="1040" height="390" fill="#f6f3eb"/>

  <rect x="35" y="110" width="190" height="145" rx="20" fill="#0b1225"/>
  <text x="72" y="165" fill="#c9f25f" font-family="Arial" font-size="25" font-weight="700">PROPOSE</text>
  <text x="72" y="205" fill="#f6f3eb" font-family="Arial" font-size="18">exact target</text>
  <text x="72" y="231" fill="#f6f3eb" font-family="Arial" font-size="18">exact change</text>

  <path d="M240 182 H300" stroke="#63d7e4" stroke-width="9"/>
  <path d="M285 162 L310 182 L285 202" fill="none" stroke="#63d7e4" stroke-width="9"/>

  <rect x="315" y="75" width="205" height="215" rx="20" fill="#c9f25f"/>
  <text x="350" y="135" fill="#0b1225" font-family="Arial" font-size="24" font-weight="700">APPROVAL</text>
  <text x="350" y="180" fill="#0b1225" font-family="Arial" font-size="18">one action</text>
  <text x="350" y="208" fill="#0b1225" font-family="Arial" font-size="18">one target</text>
  <text x="350" y="236" fill="#0b1225" font-family="Arial" font-size="16">current approval</text>

  <path d="M535 182 H595" stroke="#ff8c5a" stroke-width="9"/>
  <path d="M580 162 L605 182 L580 202" fill="none" stroke="#ff8c5a" stroke-width="9"/>

  <rect x="620" y="110" width="155" height="145" rx="20" fill="#ff8c5a"/>
  <text x="647" y="170" fill="#0b1225" font-family="Arial" font-size="22" font-weight="700">EXECUTE</text>
  <text x="647" y="207" fill="#0b1225" font-family="Arial" font-size="17">once</text>

  <path d="M790 182 H845" stroke="#a99df7" stroke-width="9"/>
  <path d="M830 162 L855 182 L830 202" fill="none" stroke="#a99df7" stroke-width="9"/>

  <rect x="870" y="75" width="135" height="215" rx="20" fill="#a99df7"/>
  <text x="891" y="130" fill="#0b1225" font-family="Arial" font-size="20" font-weight="700">VERIFY</text>
  <text x="891" y="175" fill="#0b1225" font-family="Arial" font-size="16">read result</text>
  <text x="891" y="202" fill="#0b1225" font-family="Arial" font-size="16">compare</text>
  <text x="891" y="229" fill="#0b1225" font-family="Arial" font-size="16">approved value</text>
</svg>