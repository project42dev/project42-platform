<!-- Alt text: A bounded tool contract constrains inputs before a limited tool call and checks outputs, errors, and side effects afterward. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Bounded tool contract</title>
  <desc id="desc">Inputs are constrained before a tool call, outputs are checked afterward, and side effects remain contained.</desc>
  <rect width="900" height="420" fill="#f6f3eb"/>
  <rect x="55" y="55" width="235" height="300" rx="24" fill="#0b1225"/>
  <text x="85" y="105" fill="#c9f25f" font-family="Arial" font-size="28" font-weight="700">BOUND INPUTS</text>
  <text x="85" y="155" fill="#f6f3eb" font-family="Arial" font-size="20">type</text>
  <text x="85" y="195" fill="#f6f3eb" font-family="Arial" font-size="20">length</text>
  <text x="85" y="235" fill="#f6f3eb" font-family="Arial" font-size="20">allowed target</text>
  <path d="M310 205 H380" stroke="#63d7e4" stroke-width="10"/>
  <path d="M365 185 L390 205 L365 225" fill="none" stroke="#63d7e4" stroke-width="10"/>
  <rect x="390" y="55" width="180" height="300" rx="24" fill="#63d7e4"/>
  <text x="425" y="180" fill="#0b1225" font-family="Arial" font-size="28" font-weight="700">TOOL</text>
  <text x="425" y="220" fill="#0b1225" font-family="Arial" font-size="18">limited access</text>
  <path d="M590 205 H660" stroke="#ff8c5a" stroke-width="10"/>
  <path d="M645 185 L670 205 L645 225" fill="none" stroke="#ff8c5a" stroke-width="10"/>
  <rect x="670" y="55" width="175" height="300" rx="24" fill="#a99df7"/>
  <text x="700" y="110" fill="#0b1225" font-family="Arial" font-size="25" font-weight="700">CHECKED</text>
  <text x="700" y="155" fill="#0b1225" font-family="Arial" font-size="19">output</text>
  <text x="700" y="195" fill="#0b1225" font-family="Arial" font-size="19">errors</text>
  <text x="700" y="235" fill="#0b1225" font-family="Arial" font-size="19">side effects</text>
</svg>