<!-- Alt text: An uncertain operation leads to state inspection, which either prevents duplicate work or recovers only unfinished work. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Partial failure recovery</title>
  <desc id="desc">After a possible failure, the workflow inspects state, avoids duplicate work, and retries only unfinished work.</desc>
  <rect width="900" height="430" fill="#f6f3eb"/>
  <rect x="55" y="155" width="180" height="110" rx="20" fill="#ff8c5a"/>
  <text x="92" y="205" fill="#0b1225" font-family="Arial" font-size="25" font-weight="700">UNCERTAIN</text>
  <text x="92" y="235" fill="#0b1225" font-family="Arial" font-size="17">result</text>
  <path d="M250 210 H345" stroke="#0b1225" stroke-width="8"/>
  <path d="M330 190 L355 210 L330 230" fill="none" stroke="#0b1225" stroke-width="8"/>
  <rect x="365" y="155" width="190" height="110" rx="20" fill="#63d7e4"/>
  <text x="398" y="205" fill="#0b1225" font-family="Arial" font-size="23" font-weight="700">INSPECT</text>
  <text x="398" y="235" fill="#0b1225" font-family="Arial" font-size="17">current state</text>
  <path d="M460 145 V85 H665" fill="none" stroke="#0b1225" stroke-width="7"/>
  <path d="M650 65 L675 85 L650 105" fill="none" stroke="#0b1225" stroke-width="7"/>
  <rect x="680" y="35" width="165" height="100" rx="20" fill="#a99df7"/>
  <text x="706" y="82" fill="#0b1225" font-family="Arial" font-size="20" font-weight="700">ALREADY DONE</text>
  <text x="706" y="110" fill="#0b1225" font-family="Arial" font-size="16">do not repeat</text>
  <path d="M460 275 V345 H665" fill="none" stroke="#0b1225" stroke-width="7"/>
  <path d="M650 325 L675 345 L650 365" fill="none" stroke="#0b1225" stroke-width="7"/>
  <rect x="680" y="295" width="165" height="100" rx="20" fill="#c9f25f"/>
  <text x="707" y="342" fill="#0b1225" font-family="Arial" font-size="20" font-weight="700">INCOMPLETE</text>
  <text x="707" y="370" fill="#0b1225" font-family="Arial" font-size="16">recover remaining</text>
</svg>

---