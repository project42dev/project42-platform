<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <!-- Alt text: A request flows through several possible AI capabilities—extracting stated details, classifying a category, flagging possible urgency, and preparing a summary—before a human review checkpoint. -->
  <title id="title">AI capabilities can be combined in a task workflow</title>
  <desc id="desc">A work request is processed by multiple bounded capabilities and then checked by a person.</desc>
  <rect width="1200" height="700" fill="#f6f3eb"/>
  <text x="70" y="80" fill="#0b1225" font-family="Arial, sans-serif" font-size="36" font-weight="700">MATCH AND COMBINE CAPABILITIES</text>
  <rect x="70" y="285" width="190" height="100" rx="20" fill="#0b1225"/>
  <text x="115" y="345" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="25" font-weight="700">REQUEST</text>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700">
    <rect x="350" y="150" width="220" height="90" rx="18" fill="#63d7e4"/>
    <text x="397" y="190" fill="#0b1225">EXTRACT</text>
    <text x="380" y="218" fill="#0b1225" font-size="16">stated details</text>
    <rect x="350" y="300" width="220" height="90" rx="18" fill="#c9f25f"/>
    <text x="397" y="340" fill="#0b1225">CLASSIFY</text>
    <text x="390" y="368" fill="#0b1225" font-size="16">suggest category</text>
    <rect x="350" y="450" width="220" height="90" rx="18" fill="#a99df7"/>
    <text x="405" y="490" fill="#0b1225">FLAG</text>
    <text x="378" y="518" fill="#0b1225" font-size="16">possible urgency</text>
    <rect x="660" y="285" width="220" height="100" rx="18" fill="#ff8c5a"/>
    <text x="705" y="328" fill="#0b1225">SUMMARIZE</text>
    <text x="704" y="356" fill="#0b1225" font-size="16">prepare handoff</text>
    <rect x="960" y="285" width="180" height="100" rx="20" fill="#0b1225"/>
    <text x="1000" y="328" fill="#f6f3eb">HUMAN</text>
    <text x="1002" y="356" fill="#f6f3eb">REVIEW</text>
  </g>
  <path d="M260 335 H320 M460 240 V285 M460 390 V435 M570 335 H640 M880 335 H930" stroke="#0b1225" stroke-width="8" fill="none"/>
  <path d="M310 320 l18 15 -18 15 M445 270 l15 18 15-18 M445 420 l15 18 15-18 M630 320 l18 15 -18 15 M920 320 l18 15 -18 15" fill="#0b1225"/>
</svg>