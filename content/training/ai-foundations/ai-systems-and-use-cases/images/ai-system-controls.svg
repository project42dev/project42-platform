<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <!-- Alt text: A central model receives limited, appropriate data and produces a suggestion; people, workflow, and controls surround it, while human review leads to an approved action or escalation. -->
  <title id="title">The model is one part of the AI system</title>
  <desc id="desc">Data enters a model, the model creates a suggestion, and people and controls govern the final action.</desc>
  <rect width="1200" height="700" fill="#f6f3eb"/>
  <text x="70" y="75" fill="#0b1225" font-family="Arial, sans-serif" font-size="36" font-weight="700">THE MODEL IS ONE PART</text>
  <circle cx="600" cy="315" r="120" fill="#c9f25f"/>
  <text x="535" y="305" fill="#0b1225" font-family="Arial, sans-serif" font-size="30" font-weight="700">MODEL</text>
  <text x="530" y="340" fill="#0b1225" font-family="Arial, sans-serif" font-size="18">suggestion</text>
  <g fill="#0b1225" font-family="Arial, sans-serif" font-size="25" font-weight="700">
    <rect x="90" y="250" width="250" height="100" rx="18" fill="#63d7e4"/>
    <text x="170" y="310">LIMITED DATA</text>
    <rect x="850" y="160" width="250" height="100" rx="18" fill="#a99df7"/>
    <text x="910" y="220">PEOPLE</text>
    <rect x="850" y="380" width="250" height="100" rx="18" fill="#ff8c5a"/>
    <text x="910" y="440">CONTROLS</text>
    <rect x="410" y="540" width="380" height="85" rx="18" fill="#0b1225"/>
    <text x="500" y="593" fill="#f6f3eb">HUMAN REVIEW</text>
  </g>
  <path d="M340 300 H475 M720 275 L850 210 M720 365 L850 430 M600 435 V540" stroke="#0b1225" stroke-width="8" fill="none"/>
  <path d="M460 285 l18 15 -18 15 M830 195 l20 15 -20 15 M830 415 l20 15 -20 15 M585 520 l15 20 15-20" fill="#0b1225"/>
</svg>

