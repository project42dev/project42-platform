<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <!-- Alt text: Nested layers show artificial intelligence as the broadest concept, machine learning inside it, a model inside machine learning, and a complete AI system containing the model together with data, workflow, people, and controls. -->
  <title id="title">From AI to a complete AI system</title>
  <desc id="desc">Nested layers distinguish artificial intelligence, machine learning, a model, and the complete AI system.</desc>
  <rect width="1200" height="700" fill="#f6f3eb"/>
  <rect x="70" y="55" width="1060" height="570" rx="36" fill="#0b1225"/>
  <text x="110" y="115" fill="#f6f3eb" font-family="Arial, sans-serif" font-size="32" font-weight="700">COMPLETE AI SYSTEM</text>
  <text x="110" y="150" fill="#63d7e4" font-family="Arial, sans-serif" font-size="21">People • data • workflow • software • controls</text>
  <rect x="180" y="190" width="840" height="365" rx="30" fill="#a99df7"/>
  <text x="220" y="245" fill="#0b1225" font-family="Arial, sans-serif" font-size="30" font-weight="700">ARTIFICIAL INTELLIGENCE</text>
  <rect x="300" y="285" width="600" height="215" rx="26" fill="#c9f25f"/>
  <text x="350" y="340" fill="#0b1225" font-family="Arial, sans-serif" font-size="28" font-weight="700">MACHINE LEARNING</text>
  <rect x="430" y="370" width="340" height="85" rx="18" fill="#ff8c5a"/>
  <text x="535" y="423" fill="#0b1225" font-family="Arial, sans-serif" font-size="27" font-weight="700">MODEL</text>
</svg>