name: Project42 Content Sync & Build

trigger: none
schedules:
  - cron: "0 0 * * 0"
    displayName: "Weekly Sunday Content Sync"
    branches:
      include:
        - main
    always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js 22'

  - script: |
      npm ci
      npm run content:sync
      npm test
      npm run build
    displayName: 'Sync Content, Validate & Build Static Portal'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'dist/portal'
      artifact: 'project42-portal'
      publishLocation: 'pipeline'
    displayName: 'Publish Static Portal Artifact'
