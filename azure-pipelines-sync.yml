name: Project42 Content Sync & Build

trigger: none
schedules:
  - cron: "0 0 * * 0"
    displayName: "Weekly Sunday Content Sync"
    branches:
      include:
        - main
    always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Install Node.js 22'

  - script: |
      npm ci
      npm run content:sync
      npm run check
    displayName: 'Sync Content, Validate & Build'

  # The compiled platform package, not a site. This repository does not build a
  # site: a site is built in the front-end repository "project42-portal create"
  # produces, by that repository's own pipeline. This step used to publish
  # dist/portal, the output of a static generator that has since been retired.
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'dist'
      artifact: 'project42-platform'
      publishLocation: 'pipeline'
    displayName: 'Publish Platform Package Artifact'
