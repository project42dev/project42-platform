name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install materialises the front-end application from
      # @project42/platform through this repository's postinstall hook.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
