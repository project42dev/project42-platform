name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # npm ci also materialises the front-end application from
      # @project42/platform, through this repository's postinstall hook.
      - run: npm ci
        env:
          # Mermaid generation reuses Playwright; Puppeteer's browser is unused.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Audit dependencies and run complete quality gates
        run: npm run verify
