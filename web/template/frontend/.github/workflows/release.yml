name: Signed release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate candidate without publishing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run release:validate
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=critical

  release:
    name: Publish signed tag release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release source
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npm ci
          npx playwright install --with-deps chromium --only-shell
          npm run release:validate
          npm run check
          npm audit --omit=dev --audit-level=critical
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Build release package and manifest
        run: |
          mkdir release
          tar -czf "release/{{NAME}}-${GITHUB_REF_NAME}.tgz" -C dist/pages .
          cp public/release-facts.json release/
          node scripts/release-governance.mjs manifest \
            --output release/release-manifest.json \
            --source "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --artifact "release/{{NAME}}-${GITHUB_REF_NAME}.tgz" \
            --artifact release/release-facts.json
          node scripts/release-governance.mjs rehearse \
            --manifest release/release-manifest.json \
            --output release/rehearsal-evidence.json
          (cd release && sha256sum *.tgz *.json > SHA256SUMS)
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            release/*.tgz
            release/*.json
            release/SHA256SUMS
      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "{{ORGANIZATION}} ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
