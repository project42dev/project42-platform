stages:
  - sync
  - build

# Scheduled content synchronisation.
#
# This repository builds the platform package: the contracts, the catalogue and
# the front-end application under web/. It does not build a site. A site is
# built in the front-end repository `project42-portal create` produces, whose
# own pipeline runs `npm run pages:build` and publishes dist/pages. A `pages`
# stage here used to copy an artifact this pipeline has never produced.
content_sync:
  stage: sync
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache git
  script:
    - npm ci
    - npm run content:sync
    - npm run check
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
